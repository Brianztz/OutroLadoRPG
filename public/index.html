<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outro Lado RPG — Entrar na Mesa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: dark;
            --bg: #02050a;
            --panel: rgba(4, 10, 17, 0.94);
            --panel-soft: rgba(9, 19, 29, 0.78);
            --line: rgba(121, 166, 201, 0.30);
            --line-strong: rgba(139, 204, 246, 0.66);
            --text: #e7f1f7;
            --muted: #94a9b9;
            --blue: #8bccf6;
            --blue-strong: #39aee8;
            --master: #d2e8f8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            background-color: var(--bg);
            background-image:
                linear-gradient(rgba(0, 4, 9, 0.78), rgba(0, 3, 8, 0.94)),
                radial-gradient(circle at 50% 8%, rgba(57, 174, 232, 0.20), transparent 38%),
                url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhj-H1CrLywWPDTFYUiAfN0fblQnGH3NKbZhb7nVbbJASv2JENXK4TgRPS8w4IOxxLHi8GVVyXwg4ZNAWeAnECODYIiGWTEbfSyckMu_eR8OA0mODh-CuM8FxInMy61LrxeGFnBGbVIYXuy4U333EkPMDstP8sF-S_-lfeb8SPeo77FNIlpz3Q0_R70q6yf/w1214-h684/Outro%20Lado%20RPG%20-%20Titulo.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text);
            font-family: Roboto, "Segoe UI", Arial, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(139, 204, 246, 0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 204, 246, 0.022) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at center, #000 20%, transparent 82%);
        }

        .entry-shell {
            position: relative;
            width: min(760px, 100%);
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(7, 15, 24, 0.97), rgba(1, 5, 10, 0.97));
            box-shadow: 0 32px 100px rgba(0, 0, 0, 0.72), inset 0 0 60px rgba(57, 174, 232, 0.035);
            backdrop-filter: blur(16px);
        }

        .entry-shell::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--blue-strong), var(--blue), transparent);
            box-shadow: 0 0 22px rgba(57, 174, 232, 0.65);
        }

        .brand {
            padding: clamp(28px, 6vw, 50px) clamp(22px, 7vw, 58px) 24px;
            text-align: center;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line-strong);
            border-radius: 15px;
            background: rgba(57, 174, 232, 0.08);
            box-shadow: 0 0 28px rgba(57, 174, 232, 0.14);
            color: var(--blue);
            font-size: 1.7rem;
            font-weight: 900;
            transform: rotate(45deg);
        }

        .brand-mark span { transform: rotate(-45deg); }
        .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 0.78rem; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4.4rem); line-height: 0.95; letter-spacing: -0.055em; text-transform: uppercase; }
        h1 span { color: var(--blue); text-shadow: 0 0 24px rgba(139, 204, 246, 0.22); }
        .intro { max-width: 520px; margin: 16px auto 0; color: var(--muted); font-size: 1rem; line-height: 1.55; }

        .entry-form { padding: 0 clamp(22px, 7vw, 58px) clamp(28px, 6vw, 48px); }
        .table-field { display: block; margin-bottom: 19px; }
        .table-field > span { display: block; margin-bottom: 8px; color: var(--text); font-size: 0.82rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
        .input-wrap { position: relative; }
        .input-symbol { position: absolute; top: 50%; left: 16px; transform: translateY(-50%); color: var(--blue); font-size: 1.05rem; font-weight: 900; }
        #table-input {
            width: 100%;
            min-height: 56px;
            padding: 13px 16px 13px 43px;
            border: 1px solid rgba(139, 204, 246, 0.30);
            border-radius: 11px;
            outline: none;
            background: rgba(1, 6, 12, 0.84);
            color: #fff;
            font: 900 1rem/1 Roboto, "Segoe UI", sans-serif;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            transition: 0.2s ease;
        }
        #table-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(57, 174, 232, 0.09), 0 0 24px rgba(57, 174, 232, 0.08); }

        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
        .role-button {
            min-height: 112px;
            padding: 18px;
            display: grid;
            grid-template-columns: 45px minmax(0, 1fr);
            align-items: center;
            gap: 13px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: var(--panel-soft);
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .role-button:hover, .role-button:focus-visible { transform: translateY(-2px); border-color: var(--line-strong); background: rgba(20, 44, 63, 0.72); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.30), 0 0 18px rgba(57, 174, 232, 0.10); outline: none; }
        .role-icon { width: 45px; height: 45px; display: grid; place-items: center; border: 1px solid rgba(139, 204, 246, 0.38); border-radius: 11px; background: rgba(57, 174, 232, 0.08); color: var(--blue); font-size: 1.35rem; }
        .role-copy strong { display: block; margin-bottom: 5px; font-size: 0.98rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .role-copy span { display: block; color: var(--muted); font-size: 0.78rem; line-height: 1.4; }
        .role-button.master .role-icon { border-color: rgba(210, 232, 248, 0.42); color: var(--master); }

        .hint { margin: 16px 0 0; color: #718797; font-size: 0.76rem; line-height: 1.45; text-align: center; }
        .auth-panel { margin-bottom: 20px; padding: 13px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid rgba(139, 204, 246, 0.22); border-radius: 12px; background: rgba(1, 6, 12, 0.72); }
        .auth-copy { min-width: 0; display: flex; align-items: center; gap: 11px; }
        .auth-avatar { width: 40px; height: 40px; flex: 0 0 40px; border: 1px solid var(--line-strong); border-radius: 50%; object-fit: cover; background: rgba(57, 174, 232, 0.08); }
        .auth-copy strong, .auth-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .auth-copy strong { font-size: 0.86rem; }
        .auth-copy small { margin-top: 3px; color: var(--muted); font-size: 0.7rem; }
        .auth-button { min-height: 40px; flex: 0 0 auto; padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: rgba(57, 174, 232, 0.12); color: #fff; cursor: pointer; font-weight: 900; }
        .auth-button:hover { background: rgba(57, 174, 232, 0.22); box-shadow: 0 0 18px rgba(57, 174, 232, 0.13); }
        .auth-button.secondary { border-color: rgba(148, 169, 185, 0.34); background: rgba(148, 169, 185, 0.07); color: var(--muted); }
        .auth-message { min-height: 20px; margin: -10px 0 14px; color: var(--muted); font-size: 0.78rem; text-align: center; }
        .auth-message.error { color: #ff7a82; }
        .role-button:disabled { cursor: not-allowed; opacity: 0.42; transform: none; box-shadow: none; }

        @media (max-width: 620px) {
            body { padding: 12px; }
            .entry-shell { border-radius: 15px; }
            .brand { padding-top: 34px; }
            .role-grid { grid-template-columns: 1fr; }
            .role-button { min-height: 90px; }
        }
    </style>
</head>
<body>
    <main class="entry-shell">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true"><span>◇</span></div>
            <p class="eyebrow">Portal da mesa</p>
            <h1>Outro Lado <span>RPG</span></h1>
            <p class="intro">Informe a mesa da sessão e escolha como você deseja entrar.</p>
        </header>

        <form class="entry-form" onsubmit="enterPortal('player'); return false;">
            <section class="auth-panel" aria-live="polite">
                <div class="auth-copy">
                    <img id="auth-avatar" class="auth-avatar" alt="" hidden>
                    <div><strong id="auth-name">Conta Google necessária</strong><small id="auth-email">Entre para acessar sua ficha ou o escudo.</small></div>
                </div>
                <button id="google-login" class="auth-button" type="button">ENTRAR COM GOOGLE</button>
                <button id="google-logout" class="auth-button secondary" type="button" hidden>SAIR</button>
            </section>
            <p id="auth-message" class="auth-message"></p>

            <label class="table-field" for="table-input">
                <span>Código da mesa</span>
                <div class="input-wrap">
                    <span class="input-symbol" aria-hidden="true">#</span>
                    <input id="table-input" name="mesa" type="text" maxlength="40" pattern="[A-Za-z0-9_-]+" autocomplete="off" spellcheck="false" placeholder="PADRAO" required>
                </div>
            </label>

            <div class="role-grid">
                <button class="role-button player" type="submit" disabled>
                    <span class="role-icon" aria-hidden="true">♟</span>
                    <span class="role-copy"><strong>Entrar como jogador</strong><span>Abrir sua ficha de personagem nesta mesa.</span></span>
                </button>
                <button class="role-button master" type="button" onclick="enterPortal('master')" disabled>
                    <span class="role-icon" aria-hidden="true">♜</span>
                    <span class="role-copy"><strong>Entrar como mestre</strong><span>Abrir o escudo e controlar esta mesa.</span></span>
                </button>
            </div>

            <p class="hint">Use o mesmo código para que jogadores, mestre e overlays entrem na mesma sessão.</p>
        </form>
    </main>

    <script src="firebase-client.js?v=20260914-2"></script>
    <script>
        const tableInput = document.getElementById('table-input');
        const params = new URLSearchParams(window.location.search);
        const authName = document.getElementById('auth-name');
        const authEmail = document.getElementById('auth-email');
        const authAvatar = document.getElementById('auth-avatar');
        const authMessage = document.getElementById('auth-message');
        const googleLogin = document.getElementById('google-login');
        const googleLogout = document.getElementById('google-logout');
        const roleButtons = [...document.querySelectorAll('.role-button')];

        function normalizeTableCode(value) {
            const normalized = String(value || 'PADRAO')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toUpperCase()
                .replace(/[^A-Z0-9_-]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 40);
            return normalized || 'PADRAO';
        }

        const rememberedTable = params.get('mesa') || localStorage.getItem('portal_table_code') || localStorage.getItem('player_table_code') || localStorage.getItem('master_table_code') || 'PADRAO';
        tableInput.value = normalizeTableCode(rememberedTable);
        tableInput.addEventListener('input', () => {
            const start = tableInput.selectionStart;
            tableInput.value = tableInput.value.toUpperCase().replace(/[^A-Z0-9_-]/g, '');
            tableInput.setSelectionRange(start, start);
        });

        function setPortalBusy(busy) {
            googleLogin.disabled = busy;
            googleLogout.disabled = busy;
            roleButtons.forEach(button => { button.disabled = busy || !window.__portalUser; });
        }

        function showAuthMessage(message, error = false) {
            authMessage.textContent = String(message || '');
            authMessage.classList.toggle('error', Boolean(error));
        }

        function renderAuthUser(user) {
            window.__portalUser = user || null;
            const signedIn = Boolean(user);
            authName.textContent = signedIn ? (user.displayName || 'Conta Google') : 'Conta Google necessária';
            authEmail.textContent = signedIn ? (user.email || '') : 'Entre para acessar sua ficha ou o escudo.';
            authAvatar.hidden = !signedIn || !user.photoURL;
            if (signedIn && user.photoURL) authAvatar.src = user.photoURL;
            googleLogin.hidden = signedIn;
            googleLogout.hidden = !signedIn;
            roleButtons.forEach(button => { button.disabled = !signedIn; });
        }

        function rememberValidatedPortalAccess(role, table) {
            const user = window.__portalUser;
            if (!user || !user.uid) return;
            try {
                sessionStorage.setItem('ol_firebase_portal_access', JSON.stringify({
                    role,
                    tableId: table,
                    uid: user.uid,
                    validatedAt: Date.now()
                }));
            } catch (error) {
                console.warn('Nao foi possivel guardar a validacao local da mesa:', error);
            }
        }

        function finishPortalEntry(role, table) {
            rememberValidatedPortalAccess(role, table);
            localStorage.setItem('portal_table_code', table);
            const isMaster = role === 'master';
            localStorage.setItem(isMaster ? 'master_table_code' : 'player_table_code', table);
            const destination = new URL(isMaster ? './mestre.html' : './ficha.html', window.location.href);
            destination.search = '';
            destination.searchParams.set('mesa', table);
            window.location.assign(destination.href);
        }

        async function enterPortal(role) {
            if (!tableInput.reportValidity()) return;
            const table = normalizeTableCode(tableInput.value);
            tableInput.value = table;
            showAuthMessage(role === 'master' ? 'Validando acesso do mestre...' : 'Entrando na mesa...');
            setPortalBusy(true);
            try {
                await OLFirebase.preparePortal(role, table);
                finishPortalEntry(role, table);
            } catch (error) {
                const message = String(error && error.message || 'Nao foi possivel entrar nessa mesa.');
                const harmlessExistingPlayerRefreshTimeout = role === 'player'
                    && /Firebase demorou para atualizar o jogador/i.test(message);

                if (harmlessExistingPlayerRefreshTimeout) {
                    console.warn('A atualizacao do cadastro do jogador demorou, mas o acesso ja foi validado. Entrando na mesa.', error);
                    finishPortalEntry(role, table);
                    return;
                }

                showAuthMessage(message, true);
                setPortalBusy(false);
            }
        }

        googleLogin.addEventListener('click', async () => {
            showAuthMessage('Abrindo o login do Google...');
            setPortalBusy(true);
            try {
                const user = await OLFirebase.signInWithGoogle();
                renderAuthUser(user);
                showAuthMessage('Conta conectada. Agora escolha como deseja entrar.');
            } catch (error) {
                const cancelled = error && ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error.code);
                showAuthMessage(cancelled ? 'Login cancelado.' : 'Nao foi possivel entrar com o Google.', !cancelled);
            } finally {
                setPortalBusy(false);
            }
        });

        googleLogout.addEventListener('click', async () => {
            setPortalBusy(true);
            await OLFirebase.signOut();
            renderAuthUser(null);
            showAuthMessage('Conta desconectada.');
            setPortalBusy(false);
        });

        const incomingNotice = params.get('aviso');
        if (incomingNotice) showAuthMessage(incomingNotice, true);
        OLFirebase.onUserChanged(user => renderAuthUser(user));
    </script>
</body>
</html>
