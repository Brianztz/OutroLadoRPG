<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo do Mestre</title>
    <style>
        :root {
            --bg-body: #121214; --bg-card: rgba(32,32,36,0.9); --border-color: rgba(50,50,56,0.86);
            --text-primary: #e1e1e6; --text-secondary: #a8a8b3; --accent-blue: #00b0ff;
            --accent-yellow: #ffcf33; --accent-green: #00e676; --accent-red: #e53935;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; padding: 20px; display: flex; flex-direction: column;
            background: var(--bg-body) url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEixvi2mJH9iT2I1itmVsUXChJZ6M1-9LLb2aYaubdjXd7bGBH2sYnpazs_Cr7gNZdLLw_amMEna0FiVTU9fd4qDAm85gtq00RMJSBnktnscwDQ3l_SB2vlB9lpKHhsRgihn-EsnG0PdWX-fLTggvcBd_rXCfYPqZ7Itko_-0wI6ORDKeNrahjWfj1Q9fnuM/s1920/Wallpaper%20Ordem%20Paranormal%20O%20Culto%20do%20Outro%20Lado.jpg') center / cover fixed;
            color: var(--text-primary); font-family: Roboto, Arial, sans-serif;
        }
        .mestre-top-bar {
            margin-bottom: 20px; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
            border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-card); box-shadow: 0 8px 32px rgba(0,0,0,0.8); backdrop-filter: blur(8px);
        }
        .top-title { margin: 0; color: var(--accent-yellow); font-size: 1.08em; text-transform: uppercase; letter-spacing: 0.06em; }
        .connection-info { display: flex; align-items: center; gap: 9px; margin-top: 5px; color: var(--text-secondary); font-size: 0.76em; font-weight: bold; }
        .connection-dot { width: 9px; height: 9px; border-radius: 50%; background: #666; box-shadow: 0 0 0 transparent; transition: 0.2s; }
        .connection-dot.online { background: var(--accent-green); box-shadow: 0 0 10px rgba(0,230,118,0.85); }
        .btn-open-player { padding: 10px 15px; border: 1px solid var(--accent-blue); border-radius: 7px; background: rgba(0,176,255,0.1); color: var(--accent-blue); font-size: 0.75em; font-weight: 900; text-decoration: none; transition: 0.2s; }
        .btn-open-player:hover { background: var(--accent-blue); color: #000; }
        .content-wrapper { min-height: 0; display: flex; flex: 1; gap: 20px; }
        .players-section { min-width: 0; flex: 3; display: flex; flex-direction: column; }
        .section-heading { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 0.76em; font-weight: 900; text-transform: uppercase; }
        .players-count { color: var(--accent-green); }
        .players-container { min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; align-content: flex-start; overflow-y: auto; padding-right: 8px; }
        .players-empty { grid-column: 1 / -1; padding: 45px 20px; border: 1px dashed rgba(0,230,118,0.3); border-radius: 12px; background: rgba(18,18,20,0.72); color: var(--text-secondary); text-align: center; }
        .players-empty strong { display: block; margin-bottom: 7px; color: var(--accent-green); }
        .player-card { padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative; border: 2px solid var(--border-color); border-radius: 12px; background: var(--bg-card); box-shadow: 0 8px 32px rgba(0,0,0,0.8); backdrop-filter: blur(8px); animation: card-in 0.25s ease-out; }
        .player-card::before { content: ''; position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 9px rgba(0,230,118,0.8); }
        .player-header { display: flex; align-items: center; gap: 15px; padding: 0 20px 10px 0; border-bottom: 1px solid var(--border-color); }
        .player-img { width: 60px; height: 60px; flex: 0 0 60px; border: 2px solid var(--accent-blue); border-radius: 50%; background: #09090b; object-fit: cover; }
        .player-name { margin: 0; color: var(--accent-yellow); font-size: 1.08em; font-weight: 900; text-transform: uppercase; overflow-wrap: anywhere; }
        .player-info { margin-top: 4px; color: var(--text-secondary); font-size: 0.76em; }
        .bar-label { color: var(--text-secondary); font-size: 0.69em; font-weight: 900; }
        .bar-label.vida { color: var(--accent-red); } .bar-label.sanidade { color: var(--accent-blue); }
        .bar-container { height: 20px; margin-top: 5px; position: relative; overflow: hidden; border: 1px solid #333; border-radius: 4px; background: rgba(0,0,0,0.8); }
        .bar-fill { height: 100%; transition: width 0.4s ease; }
        .fill-vida { background: linear-gradient(90deg,#8b0000,var(--accent-red)); }
        .fill-sani { background: linear-gradient(90deg,#01579b,var(--accent-blue)); }
        .bar-text { position: absolute; inset: 0; font-size: 0.78em; font-weight: 900; line-height: 18px; text-align: center; text-shadow: 1px 1px 2px #000; }
        .status-tags { min-height: 22px; display: flex; gap: 5px; flex-wrap: wrap; }
        .tag { padding: 3px 6px; border-radius: 4px; font-size: 0.65em; font-weight: 900; text-transform: uppercase; }
        .tag-lesionado { border: 1px solid var(--accent-red); background: rgba(229,57,53,0.4); }
        .tag-morrendo { background: var(--accent-red); animation: pulse-red 1.5s infinite; }
        .tag-enlouquecendo { border: 1px solid var(--accent-blue); background: rgba(0,176,255,0.4); }
        .player-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .btn-ver-ficha, .btn-add-initiative { width: 100%; margin-top: 3px; padding: 10px 6px; border-radius: 6px; font-size: 0.72em; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-ver-ficha { border: 1px solid var(--accent-blue); background: rgba(0,176,255,0.1); color: var(--accent-blue); }
        .btn-ver-ficha:hover { background: var(--accent-blue); color: #000; }
        .btn-add-initiative { border: 1px solid var(--accent-yellow); background: rgba(255,207,51,0.1); color: var(--accent-yellow); }
        .btn-add-initiative:hover { background: var(--accent-yellow); color: #000; }
        .initiative-container { min-width: 340px; flex: 1.15; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-card); backdrop-filter: blur(8px); }
        .initiative-title { padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.52); color: var(--accent-yellow); font-weight: 900; }
        .initiative-round { padding: 4px 8px; border: 1px solid rgba(255,207,51,0.35); border-radius: 999px; font-size: 0.65em; white-space: nowrap; }
        .initiative-add { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .initiative-add-row { display: grid; grid-template-columns: minmax(0,1fr) 70px 42px; gap: 6px; }
        .initiative-input { min-width: 0; width: 100%; padding: 9px; border: 1px solid #414148; border-radius: 5px; background: #111114; color: white; }
        .initiative-add-button { border: 0; border-radius: 5px; background: var(--accent-green); color: #000; font-size: 1.05em; font-weight: 900; cursor: pointer; }
        .initiative-all-button { width: 100%; margin-top: 7px; padding: 8px; border: 1px solid var(--accent-blue); border-radius: 5px; background: rgba(0,176,255,0.09); color: var(--accent-blue); font-size: 0.68em; font-weight: 900; cursor: pointer; }
        .initiative-list { min-height: 130px; padding: 10px; display: flex; flex: 1; flex-direction: column; gap: 7px; overflow-y: auto; }
        .initiative-empty { padding: 30px 12px; color: var(--text-secondary); font-size: 0.78em; line-height: 1.5; text-align: center; }
        .initiative-entry { padding: 8px; display: grid; grid-template-columns: 30px minmax(0,1fr) 58px 30px; gap: 7px; align-items: center; border: 1px solid #3b3b42; border-radius: 8px; background: rgba(18,18,20,0.94); transition: 0.2s; }
        .initiative-entry.active { border-color: var(--accent-yellow); background: rgba(255,207,51,0.12); box-shadow: 0 0 14px rgba(255,207,51,0.17); }
        .initiative-rank { width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #29292f; color: var(--text-secondary); font-size: 0.72em; font-weight: 900; }
        .initiative-entry.active .initiative-rank { background: var(--accent-yellow); color: #000; }
        .initiative-name { min-width: 0; overflow: hidden; color: var(--text-primary); font-size: 0.8em; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
        .initiative-kind { margin-top: 2px; color: var(--text-secondary); font-size: 0.58em; text-transform: uppercase; }
        .initiative-value { width: 100%; padding: 7px 3px; border: 1px solid #494950; border-radius: 5px; background: #09090b; color: var(--accent-yellow); font-weight: 900; text-align: center; }
        .initiative-remove { width: 29px; height: 29px; border: 0; border-radius: 5px; background: rgba(229,57,53,0.25); color: #ff7772; font-weight: 900; cursor: pointer; }
        .initiative-controls { padding: 10px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 7px; border-top: 1px solid var(--border-color); }
        .initiative-controls button { padding: 9px 5px; border: 0; border-radius: 5px; font-size: 0.68em; font-weight: 900; cursor: pointer; }
        .initiative-previous { background: #3b3b43; color: white; }
        .initiative-next { background: var(--accent-yellow); color: #000; }
        .initiative-clear { grid-column: 1 / -1; border: 1px solid rgba(229,57,53,0.5) !important; background: rgba(229,57,53,0.12); color: #ff7772; }
        #modal-ficha { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.92); }
        .modal-toolbar { width: 95%; max-width: 1400px; display: flex; justify-content: flex-end; }
        .btn-close-modal { margin-bottom: 10px; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent-red); color: white; font-size: 1em; font-weight: 900; cursor: pointer; }
        #iframe-ficha { width: 95%; max-width: 1400px; height: 85vh; border: 2px solid var(--border-color); border-radius: 12px; background: var(--bg-body); }
        @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-red { 50% { box-shadow: 0 0 11px var(--accent-red); } }
        @media (max-width: 850px) { body { padding: 10px; } .content-wrapper { flex-direction: column; overflow: visible; } .players-container { overflow: visible; } .initiative-container { min-width: 0; min-height: 480px; } }
    </style>
</head>
<body>
    <header class="mestre-top-bar">
        <div>
            <h1 class="top-title">Escudo do Mestre</h1>
            <div class="connection-info"><span id="connection-dot" class="connection-dot"></span><span id="connection-text">Conectando ao servidor...</span></div>
        </div>
        <a class="btn-open-player" href="index.html" target="_blank" rel="noopener">+ ABRIR NOVA FICHA</a>
    </header>

    <main class="content-wrapper">
        <section class="players-section">
            <div class="section-heading"><span>Jogadores conectados automaticamente</span><span id="players-count" class="players-count">0 ONLINE</span></div>
            <div id="players-board" class="players-container">
                <div id="players-empty" class="players-empty"><strong>Aguardando jogadores</strong>Assim que uma ficha for aberta, ela aparecerá aqui automaticamente.</div>
            </div>
        </section>
        <aside class="initiative-container">
            <div class="initiative-title"><span>⚔️ CONTROLE DE INICIATIVA</span><span id="initiative-round" class="initiative-round">AGUARDANDO</span></div>
            <div class="initiative-add">
                <div class="initiative-add-row">
                    <input id="initiative-name-input" class="initiative-input" type="text" placeholder="Nome do inimigo ou NPC">
                    <input id="initiative-value-input" class="initiative-input" type="number" value="0" aria-label="Iniciativa">
                    <button class="initiative-add-button" type="button" onclick="addManualInitiative()">+</button>
                </div>
                <button class="initiative-all-button" type="button" onclick="addAllConnectedPlayers()">+ ADICIONAR TODOS OS JOGADORES CONECTADOS</button>
            </div>
            <div id="initiative-list" class="initiative-list"></div>
            <div class="initiative-controls">
                <button id="initiative-previous" class="initiative-previous" type="button" onclick="previousInitiativeTurn()">← VOLTAR</button>
                <button id="initiative-next" class="initiative-next" type="button" onclick="nextInitiativeTurn()">INICIAR COMBATE</button>
                <button class="initiative-clear" type="button" onclick="clearInitiative()">LIMPAR INICIATIVA</button>
            </div>
        </aside>
    </main>

    <div id="modal-ficha" onclick="if(event.target===this) fecharFicha()">
        <div class="modal-toolbar"><button class="btn-close-modal" onclick="fecharFicha()">✕ FECHAR FICHA</button></div>
        <iframe id="iframe-ficha" src="" title="Ficha completa do jogador"></iframe>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const playersBoard = document.getElementById('players-board');
        const connectedPlayers = new Map();
        let initiativeState = loadInitiativeState();

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function safeNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function loadInitiativeState() {
            try {
                const saved = JSON.parse(localStorage.getItem('mestre_initiative_state'));
                const entries = Array.isArray(saved && saved.entries) ? saved.entries.map((entry, index) => ({
                    id: String(entry.id || `initiative_saved_${index}`),
                    name: String(entry.name || 'Participante'),
                    value: safeNumber(entry.value),
                    kind: entry.kind === 'player' ? 'player' : 'npc',
                    code: entry.code ? String(entry.code) : ''
                })) : [];
                return { entries, activeId: saved && saved.activeId ? String(saved.activeId) : null, round: Math.max(0, Math.floor(safeNumber(saved && saved.round))), started: Boolean(saved && saved.started) };
            } catch (error) {
                return { entries: [], activeId: null, round: 0, started: false };
            }
        }

        function saveInitiativeState() {
            localStorage.setItem('mestre_initiative_state', JSON.stringify(initiativeState));
        }

        function sortInitiativeEntries() {
            initiativeState.entries.sort((first, second) => second.value - first.value || first.name.localeCompare(second.name, 'pt-BR'));
        }

        function renderInitiative() {
            sortInitiativeEntries();
            if (initiativeState.activeId && !initiativeState.entries.some(entry => entry.id === initiativeState.activeId)) {
                initiativeState.activeId = null;
                initiativeState.started = false;
                initiativeState.round = 0;
            }

            const list = document.getElementById('initiative-list');
            list.innerHTML = '';
            if (!initiativeState.entries.length) {
                const empty = document.createElement('div');
                empty.className = 'initiative-empty';
                empty.textContent = 'Adicione os jogadores conectados, inimigos ou NPCs para começar o combate.';
                list.appendChild(empty);
            }

            initiativeState.entries.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = `initiative-entry${entry.id === initiativeState.activeId ? ' active' : ''}`;
                row.innerHTML = `<div class="initiative-rank">${index + 1}</div><div><div class="initiative-name">${escapeHtml(entry.name)}</div><div class="initiative-kind">${entry.kind === 'player' ? 'Jogador' : 'Inimigo / NPC'}</div></div><input class="initiative-value" type="number" value="${entry.value}" aria-label="Iniciativa de ${escapeHtml(entry.name)}"><button class="initiative-remove" type="button" title="Remover">×</button>`;
                row.querySelector('.initiative-value').onchange = event => updateInitiativeValue(entry.id, event.target.value);
                row.querySelector('.initiative-remove').onclick = () => removeInitiativeEntry(entry.id);
                list.appendChild(row);
            });

            document.getElementById('initiative-round').textContent = initiativeState.started ? `RODADA ${initiativeState.round}` : 'AGUARDANDO';
            document.getElementById('initiative-next').textContent = initiativeState.started ? 'PRÓXIMO TURNO →' : 'INICIAR COMBATE';
            document.getElementById('initiative-previous').disabled = !initiativeState.started || !initiativeState.entries.length;
        }

        function addInitiativeEntry(entry) {
            const existing = initiativeState.entries.find(item => item.id === entry.id);
            if (existing) {
                existing.name = entry.name;
                existing.kind = entry.kind;
                existing.code = entry.code || existing.code;
            } else {
                initiativeState.entries.push(entry);
            }
            saveInitiativeState();
            renderInitiative();
        }

        function addManualInitiative() {
            const nameInput = document.getElementById('initiative-name-input');
            const valueInput = document.getElementById('initiative-value-input');
            const name = nameInput.value.trim();
            if (!name) return nameInput.focus();
            addInitiativeEntry({ id: `npc_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, name, value: safeNumber(valueInput.value), kind: 'npc', code: '' });
            nameInput.value = '';
            valueInput.value = '0';
            nameInput.focus();
        }

        function addConnectedPlayerToInitiative(code) {
            const player = connectedPlayers.get(String(code));
            if (!player) return;
            addInitiativeEntry({ id: `player_${code}`, name: String(player.nome || 'Personagem sem nome'), value: 0, kind: 'player', code: String(code) });
        }

        function addAllConnectedPlayers() {
            connectedPlayers.forEach((player, code) => {
                const id = `player_${code}`;
                const existing = initiativeState.entries.find(entry => entry.id === id);
                if (existing) existing.name = String(player.nome || 'Personagem sem nome');
                else initiativeState.entries.push({ id, name: String(player.nome || 'Personagem sem nome'), value: 0, kind: 'player', code: String(code) });
            });
            saveInitiativeState();
            renderInitiative();
        }

        function updateInitiativeValue(id, value) {
            const entry = initiativeState.entries.find(item => item.id === id);
            if (!entry) return;
            entry.value = safeNumber(value);
            saveInitiativeState();
            renderInitiative();
        }

        function removeInitiativeEntry(id) {
            initiativeState.entries = initiativeState.entries.filter(entry => entry.id !== id);
            saveInitiativeState();
            renderInitiative();
        }

        function nextInitiativeTurn() {
            sortInitiativeEntries();
            if (!initiativeState.entries.length) return;
            if (!initiativeState.started || !initiativeState.activeId) {
                initiativeState.started = true;
                initiativeState.round = 1;
                initiativeState.activeId = initiativeState.entries[0].id;
            } else {
                const currentIndex = initiativeState.entries.findIndex(entry => entry.id === initiativeState.activeId);
                const nextIndex = (currentIndex + 1) % initiativeState.entries.length;
                if (nextIndex === 0) initiativeState.round++;
                initiativeState.activeId = initiativeState.entries[nextIndex].id;
            }
            saveInitiativeState();
            renderInitiative();
        }

        function previousInitiativeTurn() {
            sortInitiativeEntries();
            if (!initiativeState.started || !initiativeState.entries.length) return;
            const currentIndex = initiativeState.entries.findIndex(entry => entry.id === initiativeState.activeId);
            const previousIndex = currentIndex <= 0 ? initiativeState.entries.length - 1 : currentIndex - 1;
            if (currentIndex === 0 && initiativeState.round > 1) initiativeState.round--;
            initiativeState.activeId = initiativeState.entries[previousIndex].id;
            saveInitiativeState();
            renderInitiative();
        }

        function clearInitiative() {
            if (initiativeState.entries.length && !confirm('Limpar toda a iniciativa e encerrar o combate?')) return;
            initiativeState = { entries: [], activeId: null, round: 0, started: false };
            saveInitiativeState();
            renderInitiative();
        }

        function updateConnection(online) {
            document.getElementById('connection-dot').classList.toggle('online', online);
            document.getElementById('connection-text').textContent = online ? 'Conexão automática ativa' : 'Servidor desconectado — tentando reconectar';
        }

        function updatePlayersCount() {
            const count = playersBoard.querySelectorAll('.player-card').length;
            document.getElementById('players-count').textContent = `${count} ${count === 1 ? 'ONLINE' : 'ONLINE'}`;
            let empty = document.getElementById('players-empty');
            if (!count && !empty) {
                empty = document.createElement('div');
                empty.id = 'players-empty';
                empty.className = 'players-empty';
                empty.innerHTML = '<strong>Aguardando jogadores</strong>Assim que uma ficha for aberta, ela aparecerá aqui automaticamente.';
                playersBoard.appendChild(empty);
            } else if (count && empty) {
                empty.remove();
            }
        }

        function renderPlayer(rawData) {
            if (!rawData || !rawData.codigo) return;
            const data = rawData;
            const code = String(data.codigo);
            connectedPlayers.set(code, data);
            const initiativePlayer = initiativeState.entries.find(entry => entry.id === `player_${code}`);
            if (initiativePlayer && initiativePlayer.name !== String(data.nome || 'Personagem sem nome')) {
                initiativePlayer.name = String(data.nome || 'Personagem sem nome');
                saveInitiativeState();
                renderInitiative();
            }
            let card = document.getElementById(`player-${code}`);
            if (!card) {
                card = document.createElement('article');
                card.className = 'player-card';
                card.id = `player-${code}`;
                playersBoard.appendChild(card);
            }

            const lifeCurrent = safeNumber(data.vida_atual);
            const lifeMaximum = Math.max(0, safeNumber(data.vida_max));
            const sanityCurrent = safeNumber(data.sani_atual);
            const sanityMaximum = Math.max(0, safeNumber(data.sani_max));
            const lifePercent = lifeMaximum ? Math.min(100, Math.max(0, lifeCurrent / lifeMaximum * 100)) : 0;
            const sanityPercent = sanityMaximum ? Math.min(100, Math.max(0, sanityCurrent / sanityMaximum * 100)) : 0;
            let tags = '';
            if (data.status) {
                if (data.status.morrendo) tags += '<span class="tag tag-morrendo">Morrendo</span>';
                else if (data.status.lesionado) tags += '<span class="tag tag-lesionado">Lesionado</span>';
                if (data.status.inconsciente) tags += '<span class="tag tag-lesionado">Inconsciente</span>';
                if (data.status.enlouquecendo) tags += '<span class="tag tag-enlouquecendo">Enlouquecendo</span>';
            }

            card.innerHTML = `
                <div class="player-header">
                    <img src="${escapeHtml(data.foto || '')}" class="player-img" alt="">
                    <div><h2 class="player-name">${escapeHtml(data.nome || 'Personagem sem nome')}</h2><div class="player-info">NEX: ${escapeHtml(data.nex || 0)}% · Defesa: ${escapeHtml(data.defesa ?? 0)}</div></div>
                </div>
                <div><div class="bar-label vida">VIDA</div><div class="bar-container"><div class="bar-fill fill-vida" style="width:${lifePercent}%"></div><div class="bar-text">${lifeCurrent} / ${lifeMaximum}</div></div></div>
                <div><div class="bar-label sanidade">SANIDADE</div><div class="bar-container"><div class="bar-fill fill-sani" style="width:${sanityPercent}%"></div><div class="bar-text">${sanityCurrent} / ${sanityMaximum}</div></div></div>
                <div class="status-tags">${tags}</div>
                <div class="player-actions"><button class="btn-ver-ficha" type="button">🔍 VER FICHA</button><button class="btn-add-initiative" type="button">⚔️ INICIATIVA</button></div>`;
            card.querySelector('.btn-ver-ficha').onclick = () => abrirFicha(code);
            card.querySelector('.btn-add-initiative').onclick = () => addConnectedPlayerToInitiative(code);
            updatePlayersCount();
        }

        function removePlayer(code) {
            code = String(code || '');
            connectedPlayers.delete(code);
            const card = document.getElementById(`player-${code}`);
            if (card) card.remove();
            updatePlayersCount();
        }

        function abrirFicha(code) {
            document.getElementById('iframe-ficha').src = `index.html?view=${encodeURIComponent(code)}`;
            document.getElementById('modal-ficha').style.display = 'flex';
        }

        function fecharFicha() {
            document.getElementById('modal-ficha').style.display = 'none';
            document.getElementById('iframe-ficha').src = '';
        }

        socket.on('connect', () => {
            updateConnection(true);
            socket.emit('master_ready');
        });
        socket.on('disconnect', () => updateConnection(false));
        socket.on('players_snapshot', players => {
            playersBoard.querySelectorAll('.player-card').forEach(card => card.remove());
            connectedPlayers.clear();
            (Array.isArray(players) ? players : []).forEach(renderPlayer);
            updatePlayersCount();
        });
        socket.on('update_mestre', renderPlayer);
        socket.on('player_disconnected', data => removePlayer(data && data.codigo));

        document.getElementById('initiative-name-input').addEventListener('keydown', event => { if (event.key === 'Enter') addManualInitiative(); });
        document.getElementById('initiative-value-input').addEventListener('keydown', event => { if (event.key === 'Enter') addManualInitiative(); });
        updatePlayersCount();
        renderInitiative();
    </script>
</body>
</html>
