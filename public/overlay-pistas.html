<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay de Pistas</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        @font-face { font-family: "ITC Krist"; src: url("./ITCKRIST.TTF") format("truetype"); font-display: swap; }
        :root { color-scheme: dark; --accent-yellow: #d2e8f8; --text-secondary: #91a0ab; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
        body { color: white; font-family: "ITC Krist", sans-serif; }

        .table-button {
            position: fixed; z-index: 100; top: 16px; right: 16px; padding: 8px 13px;
            border: 1px solid rgba(0,184,245,0.55); border-radius: 999px; background: rgba(7,10,14,0.78);
            box-shadow: 0 0 14px rgba(0,184,245,0.14),0 6px 18px rgba(0,0,0,0.38); color: #a9bac4;
            font: 800 0.72rem/1 "ITC Krist",sans-serif; letter-spacing: .7px; text-transform: uppercase;
            cursor: pointer; opacity: .72; transition: .2s ease;
        }
        .table-button:hover { opacity: 1; border-color: #00b8f5; box-shadow: 0 0 18px rgba(0,184,245,.28); }
        .table-button span { color: white; }

        .inspection-root { position: fixed; inset: 0; opacity: 0; visibility: hidden; perspective: 1500px; transition: opacity .32s ease,visibility 0s linear .32s; }
        .inspection-root::before { content: ''; position: absolute; z-index: 0; inset: 0; opacity: 0; background: radial-gradient(ellipse at center,rgba(4,10,17,.38) 0%,rgba(2,6,11,.49) 46%,rgba(0,2,5,.66) 100%); transition: opacity .55s ease; pointer-events: none; }
        .inspection-root.active { opacity: 1; visibility: visible; transition: opacity .32s ease; }
        .inspection-root.active::before { opacity: 1; }
        .inspection-root.leaving::before { opacity: 0; transition-duration: .6s; }
        .inspection-stage { position: absolute; z-index: 1; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 1500px; transform-style: preserve-3d; transform-origin: center; }
        .inspection-root.active:not(.leaving) .inspection-stage { animation: clue-stage-enter .72s cubic-bezier(.18,.78,.22,1) both; }
        .inspection-root.leaving .inspection-stage { animation: clue-stage-exit .58s cubic-bezier(.4,0,.7,.2) both; }

        .clue-3d-object { position: relative; width: 300px; height: 200px; max-width: none; display: none; transform-style: preserve-3d; transform: rotateX(-8deg) rotateY(0deg); transition: width .18s ease,height .18s ease; }
        .clue-3d-object.visible { display: block; }
        .clue-3d-depth { position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d; }
        .clue-3d-depth-layer { position: absolute; inset: 0; display: none; pointer-events: none; background: var(--clue-edge-color,#68686f); transform: translateZ(var(--clue-depth)); -webkit-mask-image: var(--clue-shape-image); mask-image: var(--clue-shape-image); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .clue-3d-object.has-image-shape .clue-3d-depth-layer { display: block; }
        .clue-3d-face { position: absolute; inset: 0; overflow: visible; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; backface-visibility: hidden; }
        .clue-3d-front { transform: translateZ(var(--clue-face-depth,12px)); }
        .clue-3d-back { transform: rotateY(180deg) translateZ(var(--clue-face-depth,12px)); }
        .clue-3d-image { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; pointer-events: none; filter: drop-shadow(0 14px 15px rgba(0,0,0,.58)); }
        .clue-3d-fallback { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; border-radius: 6px; background: #16130c; color: var(--accent-yellow); font-size: 4em; }

        .clue-book-3d-object { position: relative; width: 640px; height: 360px; max-width: none; display: none; transform: translateX(-25%) rotateX(-8deg) rotateY(0deg); transform-style: preserve-3d; transition: width .3s ease,height .3s ease; }
        .clue-book-3d-object.visible { display: block; }
        .clue-book { position: absolute; inset: 3.4% 2.8%; z-index: 6; display: flex; opacity: 0; filter: drop-shadow(0 20px 20px rgba(0,0,0,.58)); transform: translateZ(calc(var(--clue-book-cover-half,8px) + 2px)); transform-style: preserve-3d; transition: opacity .35s .22s; }
        .clue-book.open { opacity: 1; }
        .clue-book::before { content: ''; position: absolute; left: 50%; top: -2%; bottom: -2%; width: 12px; z-index: 8; transform: translateX(-50%); border-radius: 50%; background: linear-gradient(90deg,rgba(60,39,20,.8),rgba(20,12,8,.9),rgba(93,62,31,.74)); box-shadow: 0 0 12px rgba(0,0,0,.8); pointer-events: none; }
        .clue-book-cover { position: absolute; left: 50%; top: 0; z-index: 12; width: 50%; height: 100%; transform: rotateY(0deg) translateZ(var(--clue-book-front-center,7px)); transform-origin: left center; transform-style: preserve-3d; transition: transform .82s cubic-bezier(.58,.02,.28,1),opacity .2s .6s; }
        .clue-book-cover.open { z-index: 4; transform: rotateY(-180deg) translateZ(var(--clue-book-front-center,7px)); opacity: 1; pointer-events: none; }
        .clue-book-cover-depth,.clue-book-back-cover-depth { position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d; }
        .clue-book-cover-depth-layer { position: absolute; inset: 0; background: var(--clue-book-edge-color,#4a2d18); transform: translateZ(var(--clue-book-depth)); -webkit-mask-image: var(--clue-book-cover-shape); mask-image: var(--clue-book-cover-shape); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
        .clue-book-cover img { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: fill; background: transparent; filter: drop-shadow(8px 12px 16px rgba(0,0,0,.65)); backface-visibility: hidden; }
        .clue-book-cover-face.front { transform: translateZ(var(--clue-book-cover-half,8px)); }
        .clue-book-cover-face.back { transform: rotateY(180deg) translateZ(var(--clue-book-cover-half,8px)) scaleX(-1); }
        .clue-book-cover-fallback { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; border-radius: 8px; background: linear-gradient(135deg,#55351e,#21130d); color: var(--accent-yellow); font-size: 4em; transform: translateZ(var(--clue-book-cover-half,8px)); }
        .clue-book-back-cover { position: absolute; left: 50%; top: 0; z-index: 2; width: 50%; height: 100%; transform: translateZ(var(--clue-book-rear-center,-9px)); transform-style: preserve-3d; }
        .clue-book-back-cover-depth-layer { position: absolute; inset: 0; background: var(--clue-book-back-edge-color,#4a2d18); transform: translateZ(var(--clue-book-back-depth)); -webkit-mask-image: var(--clue-book-back-shape); mask-image: var(--clue-book-back-shape); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
        .clue-book-back-cover img { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: fill; background: transparent; filter: drop-shadow(8px 12px 16px rgba(0,0,0,.58)); backface-visibility: hidden; }
        .clue-book-back-cover-face.front { transform: translateZ(var(--clue-book-cover-half,8px)); }
        .clue-book-back-cover-face.back { transform: rotateY(180deg) translateZ(var(--clue-book-cover-half,8px)); }
        .clue-book-back-cover-face.front.mirrored { transform: translateZ(var(--clue-book-cover-half,8px)) scaleX(-1); }
        .clue-book-back-cover-face.back.mirrored { transform: rotateY(180deg) translateZ(var(--clue-book-cover-half,8px)) scaleX(-1); }
        .clue-book-page { position: relative; width: 50%; height: 100%; overflow: hidden; box-sizing: border-box; background: linear-gradient(135deg,#eadfca,#cabb9e); color: #282016; transform-style: preserve-3d; }
        .clue-book-page.left { border-radius: 10px 2px 2px 10px; box-shadow: inset -18px 0 24px rgba(49,31,12,.22),inset 0 0 0 1px rgba(76,51,26,.25); transform: rotateY(2deg) translateZ(2px); transform-origin: right center; }
        .clue-book-page.right { border-radius: 2px 10px 10px 2px; box-shadow: inset 18px 0 24px rgba(49,31,12,.22),inset 0 0 0 1px rgba(76,51,26,.25); transform: rotateY(-2deg) translateZ(2px); transform-origin: left center; }
        .clue-book-page img,.clue-book-flip-face img { width: 100%; height: 100%; display: block; object-fit: fill; image-rendering: auto; background: transparent; }
        .clue-book-page-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; color: rgba(49,35,20,.48); font-family: Georgia,serif; font-size: 1.1em; font-style: italic; text-align: center; }
        .clue-book-page-number { position: absolute; left: 10px; right: 10px; bottom: 7px; color: rgba(44,31,18,.7); font-family: Georgia,serif; font-size: .7em; font-weight: bold; text-align: center; text-shadow: 0 1px rgba(255,255,255,.45); pointer-events: none; }
        .clue-book-flip { position: absolute; top: 0; width: 50%; height: 100%; display: none; z-index: 7; transform-style: preserve-3d; }
        .clue-book-flip-face { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(135deg,#eadfca,#cabb9e); backface-visibility: hidden; box-shadow: inset 0 0 0 1px rgba(76,51,26,.25); }
        .clue-book-flip-face.back { transform: rotateY(180deg); }
        .clue-book-flip.next { left: 50%; display: block; transform-origin: left center; animation: clue-book-next .76s cubic-bezier(.58,.02,.28,1) forwards; }
        .clue-book-flip.previous { left: 0; display: block; transform-origin: right center; animation: clue-book-previous .76s cubic-bezier(.58,.02,.28,1) forwards; }
        .clue-book-flip.next .clue-book-flip-face.front { border-radius: 2px 10px 10px 2px; box-shadow: inset 18px 0 24px rgba(49,31,12,.25); }
        .clue-book-flip.next .clue-book-flip-face.back { border-radius: 10px 2px 2px 10px; box-shadow: inset -18px 0 24px rgba(49,31,12,.25); }
        .clue-book-flip.previous .clue-book-flip-face.front { border-radius: 10px 2px 2px 10px; box-shadow: inset -18px 0 24px rgba(49,31,12,.25); }
        .clue-book-flip.previous .clue-book-flip-face.back { border-radius: 2px 10px 10px 2px; box-shadow: inset 18px 0 24px rgba(49,31,12,.25); }

        .inspection-caption { position: fixed; z-index: 40; left: 50%; bottom: 2.5vh; display: grid; gap: 2px; min-width: 220px; padding: 8px 18px; border: 1px solid rgba(0,184,245,.26); border-radius: 999px; background: rgba(4,8,13,.72); text-align: center; transform: translateX(-50%); opacity: 0; transition: opacity .3s ease; }
        .inspection-root.active .inspection-caption { opacity: 1; }
        .inspection-root.leaving .inspection-caption { opacity: 0; transform: translateX(-50%) translateY(8px); transition: opacity .32s ease,transform .42s ease; }
        .inspection-caption strong { color: #eefaff; font-size: clamp(.8rem,1.25vw,1.05rem); letter-spacing: 1px; text-transform: uppercase; }
        .inspection-caption span { color: #79cfee; font-size: clamp(.52rem,.75vw,.68rem); letter-spacing: .7px; text-transform: uppercase; }
        .waiting { position: fixed; left: 50%; bottom: 28px; color: rgba(160,190,205,.55); font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; transform: translateX(-50%); transition: opacity .25s ease; }
        .inspection-root.active ~ .waiting { opacity: 0; }
        @keyframes clue-book-next { 0% { transform: rotateY(0deg); } 45% { box-shadow: 12px 8px 18px rgba(0,0,0,.42); } 100% { transform: rotateY(-180deg); } }
        @keyframes clue-book-previous { 0% { transform: rotateY(0deg); } 45% { box-shadow: -12px 8px 18px rgba(0,0,0,.42); } 100% { transform: rotateY(180deg); } }
        @keyframes clue-stage-enter {
            0% { opacity: 0; filter: blur(15px) brightness(1.65); transform: translateY(24px) scale(.82); }
            58% { opacity: 1; filter: blur(1px) brightness(1.16); transform: translateY(-3px) scale(1.025); }
            100% { opacity: 1; filter: blur(0) brightness(1); transform: translateY(0) scale(1); }
        }
        @keyframes clue-stage-exit {
            0% { opacity: 1; filter: blur(0) brightness(1); transform: translateY(0) scale(1); }
            42% { opacity: .78; filter: blur(2px) brightness(.88); transform: translateY(-3px) scale(1.015); }
            100% { opacity: 0; filter: blur(14px) brightness(.55); transform: translateY(18px) scale(.84); }
        }
    </style>
</head>
<body>
    <button class="table-button" type="button" onclick="chooseTable()">MESA: <span id="table-code">PADRAO</span></button>
    <main id="inspection-root" class="inspection-root" aria-hidden="true">
        <div class="inspection-stage">
            <div id="clue-3d-object" class="clue-3d-object">
                <div id="clue-3d-depth" class="clue-3d-depth" aria-hidden="true"></div>
                <div class="clue-3d-face clue-3d-front"><img id="clue-3d-image" class="clue-3d-image" alt="Frente da pista"><div id="clue-3d-fallback" class="clue-3d-fallback">🔎</div></div>
                <div class="clue-3d-face clue-3d-back"><img id="clue-3d-back-image" class="clue-3d-image" alt="Verso da pista"><div id="clue-3d-back-fallback" class="clue-3d-fallback">🔎</div></div>
            </div>
            <div id="clue-book-3d-object" class="clue-book-3d-object">
                <div id="clue-book-cover" class="clue-book-cover"><div id="clue-book-cover-depth" class="clue-book-cover-depth"></div><img id="clue-book-cover-image" class="clue-book-cover-face front" alt="Capa do livro"><img id="clue-book-cover-back-image" class="clue-book-cover-face back" alt="Verso da capa"><div id="clue-book-cover-fallback" class="clue-book-cover-fallback">📖</div></div>
                <div id="clue-book-back-cover" class="clue-book-back-cover"><div id="clue-book-back-cover-depth" class="clue-book-back-cover-depth"></div><img id="clue-book-back-cover-inside-image" class="clue-book-back-cover-face front" alt="Parte interna da contracapa"><img id="clue-book-back-cover-image" class="clue-book-back-cover-face back" alt="Contracapa"></div>
                <div id="clue-book" class="clue-book"><div id="clue-book-left-page" class="clue-book-page left"></div><div id="clue-book-right-page" class="clue-book-page right"></div><div id="clue-book-flip" class="clue-book-flip"><div id="clue-book-flip-front" class="clue-book-flip-face front"></div><div id="clue-book-flip-back" class="clue-book-flip-face back"></div></div></div>
            </div>
        </div>
        <div class="inspection-caption"><strong id="inspection-title">PISTA</strong><span id="inspection-player">INSPEÇÃO AO VIVO</span></div>
    </main>
    <div class="waiting">Aguardando uma pista ser inspecionada</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        let tablePinned = Boolean(urlParams.get('mesa'));
        let tableCode = normalizeTableCode(urlParams.get('mesa') || localStorage.getItem('clue_overlay_table_code') || localStorage.getItem('overlay_table_code') || localStorage.getItem('master_table_code') || 'PADRAO');
        let activeInspection = null;
        let renderedSpread = 0;
        let pageTurnTimer = null;
        let inspectionTransitionSequence = 0;

        const root = document.getElementById('inspection-root');
        const object3D = document.getElementById('clue-3d-object');
        const book3D = document.getElementById('clue-book-3d-object');
        document.getElementById('table-code').textContent = tableCode;
        localStorage.setItem('clue_overlay_table_code', tableCode);

        function normalizeTableCode(value) {
            const normalized = String(value || 'PADRAO').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/[^A-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
            return normalized || 'PADRAO';
        }

        function clamp(value, minimum, maximum, fallback = 0) {
            const number = Number(value);
            return Math.max(minimum, Math.min(maximum, Number.isFinite(number) ? number : fallback));
        }

        function chooseTable() {
            const requested = prompt('Digite o nome ou código da mesa:', tableCode);
            if (requested === null) return;
            tablePinned = true;
            tableCode = normalizeTableCode(requested);
            document.getElementById('table-code').textContent = tableCode;
            localStorage.setItem('clue_overlay_table_code', tableCode);
            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('mesa', tableCode);
            history.replaceState(null,'',nextUrl);
            hideInspection();
            if (socket.connected) socket.emit('clue_overlay_ready',{ mesa: tableCode });
        }

        function setImage(imageId, fallbackId, source, onLoad) {
            const image = document.getElementById(imageId);
            const fallback = fallbackId ? document.getElementById(fallbackId) : null;
            const safeSource = String(source || '');
            if (!safeSource) {
                image.removeAttribute('src');
                image.style.display = 'none';
                if (fallback) fallback.style.display = 'flex';
                return;
            }
            image.style.display = 'block';
            if (fallback) fallback.style.display = 'none';
            image.onload = () => {
                image.style.display = 'block';
                if (fallback) fallback.style.display = 'none';
                if (onLoad) onLoad(image);
            };
            image.onerror = () => {
                image.style.display = 'none';
                if (fallback) fallback.style.display = 'flex';
            };
            if (image.getAttribute('src') !== safeSource) image.src = safeSource;
            else if (image.complete && image.naturalWidth && onLoad) onLoad(image);
        }

        function setShape(element, property, source, edgeProperty, edgeColor) {
            if (!source) {
                element.style.removeProperty(property);
                element.style.removeProperty(edgeProperty);
                return;
            }
            element.style.setProperty(property,`url(${JSON.stringify(source)})`);
            element.style.setProperty(edgeProperty,edgeColor);
        }

        function fitBaseSize(element, aspect, widthRatio, heightRatio) {
            const safeAspect = clamp(aspect,0.35,8,1.5);
            const maxWidth = Math.max(150,window.innerWidth * widthRatio);
            const maxHeight = Math.max(140,window.innerHeight * heightRatio);
            let width = maxWidth;
            let height = width / safeAspect;
            if (height > maxHeight) { height = maxHeight; width = height * safeAspect; }
            element.dataset.baseWidth = String(width);
            element.dataset.baseHeight = String(height);
        }

        function applyObjectThickness(clue) {
            const thickness = clamp(clue.thickness,4,40,18);
            const half = thickness / 2;
            object3D.style.setProperty('--clue-face-depth',`${half}px`);
            const container = document.getElementById('clue-3d-depth');
            container.replaceChildren();
            const fragment = document.createDocumentFragment();
            for (let depth = -half; depth <= half; depth++) {
                const layer = document.createElement('span');
                layer.className = 'clue-3d-depth-layer';
                layer.style.setProperty('--clue-depth',`${depth}px`);
                layer.style.filter = `brightness(${.62 + (1 - Math.abs(depth) / Math.max(1,half)) * .46})`;
                fragment.appendChild(layer);
            }
            container.appendChild(fragment);
        }

        function applyBookThickness(clue) {
            const thickness = clamp(clue.thickness,4,40,18);
            const half = thickness / 2;
            book3D.style.setProperty('--clue-book-cover-half',`${half}px`);
            book3D.style.setProperty('--clue-book-front-center',`${half - 1}px`);
            book3D.style.setProperty('--clue-book-rear-center',`${-(half + 1)}px`);
            [['clue-book-cover-depth','clue-book-cover-depth-layer','--clue-book-depth'],['clue-book-back-cover-depth','clue-book-back-cover-depth-layer','--clue-book-back-depth']].forEach(([id,className,property]) => {
                const container = document.getElementById(id);
                container.replaceChildren();
                const fragment = document.createDocumentFragment();
                for (let depth = -half; depth <= half; depth++) {
                    const layer = document.createElement('span');
                    layer.className = className;
                    layer.style.setProperty(property,`${depth}px`);
                    layer.style.filter = `brightness(${.58 + (1 - Math.abs(depth) / Math.max(1,half)) * .4})`;
                    fragment.appendChild(layer);
                }
                container.appendChild(fragment);
            });
        }

        function setPageContent(element,page,pageIndex,totalPages,emptyLabel) {
            element.replaceChildren();
            if (page && page.img) {
                const image = document.createElement('img');
                image.src = page.img;
                image.alt = `Página ${pageIndex + 1}`;
                image.onerror = () => {
                    image.remove();
                    const error = document.createElement('div');
                    error.className = 'clue-book-page-empty';
                    error.textContent = 'Não foi possível carregar esta página.';
                    element.prepend(error);
                };
                const number = document.createElement('div');
                number.className = 'clue-book-page-number';
                number.textContent = `${pageIndex + 1} / ${totalPages}`;
                element.append(image,number);
            } else {
                const empty = document.createElement('div');
                empty.className = 'clue-book-page-empty';
                empty.textContent = emptyLabel;
                element.appendChild(empty);
            }
        }

        function renderSpread(spread) {
            if (!activeInspection || activeInspection.clue.type !== 'book') return;
            const pages = Array.isArray(activeInspection.clue.pages) ? activeInspection.clue.pages : [];
            renderedSpread = Math.max(0,Math.floor(Number(spread) || 0));
            setPageContent(document.getElementById('clue-book-left-page'),pages[renderedSpread],renderedSpread,pages.length,'Livro vazio');
            setPageContent(document.getElementById('clue-book-right-page'),pages[renderedSpread + 1],renderedSpread + 1,pages.length,'Fim do livro');
            document.getElementById('clue-book-flip').className = 'clue-book-flip';
        }

        function animateSpread(targetSpread,direction) {
            const pages = Array.isArray(activeInspection.clue.pages) ? activeInspection.clue.pages : [];
            const previousSpread = renderedSpread;
            const flip = document.getElementById('clue-book-flip');
            const left = document.getElementById('clue-book-left-page');
            const right = document.getElementById('clue-book-right-page');
            const front = document.getElementById('clue-book-flip-front');
            const back = document.getElementById('clue-book-flip-back');
            clearTimeout(pageTurnTimer);
            if (direction > 0) {
                setPageContent(right,pages[targetSpread + 1],targetSpread + 1,pages.length,'Fim do livro');
                setPageContent(front,pages[previousSpread + 1],previousSpread + 1,pages.length,'Página em branco');
                setPageContent(back,pages[targetSpread],targetSpread,pages.length,'Página em branco');
                flip.className = 'clue-book-flip next';
            } else {
                setPageContent(left,pages[targetSpread],targetSpread,pages.length,'Página em branco');
                setPageContent(front,pages[previousSpread],previousSpread,pages.length,'Página em branco');
                setPageContent(back,pages[targetSpread + 1],targetSpread + 1,pages.length,'Página em branco');
                flip.className = 'clue-book-flip previous';
            }
            renderedSpread = targetSpread;
            pageTurnTimer = setTimeout(() => renderSpread(targetSpread),780);
        }

        function renderObject(clue,state) {
            book3D.classList.remove('visible');
            object3D.classList.add('visible');
            const front = String(clue.img || '');
            const back = String(clue.backImg || front);
            setShape(object3D,'--clue-shape-image',front,'--clue-edge-color',clue.edgeColor || '#68686f');
            object3D.classList.toggle('has-image-shape',Boolean(front));
            applyObjectThickness(clue);
            const fitNatural = image => {
                if (!activeInspection || Number(activeInspection.state.aspect) > 0) return;
                activeInspection.state.aspect = image.naturalWidth / Math.max(1,image.naturalHeight);
                fitAndTransform();
            };
            setImage('clue-3d-image','clue-3d-fallback',front,fitNatural);
            setImage('clue-3d-back-image','clue-3d-back-fallback',back);
            fitBaseSize(object3D,Number(state.aspect) > 0 ? state.aspect : 1.5,.82,.76);
        }

        function renderBook(clue,state) {
            object3D.classList.remove('visible');
            book3D.classList.add('visible');
            const pages = Array.isArray(clue.pages) ? clue.pages : [];
            const cover = String(clue.coverImg || (pages[0] && pages[0].img) || '');
            const back = String(clue.coverBackImg || cover);
            setImage('clue-book-cover-image','clue-book-cover-fallback',cover);
            setImage('clue-book-cover-back-image',null,cover);
            setImage('clue-book-back-cover-inside-image',null,back);
            setImage('clue-book-back-cover-image',null,back);
            const mirrorBack = !clue.hasCustomBack;
            document.getElementById('clue-book-back-cover-inside-image').classList.toggle('mirrored',mirrorBack);
            document.getElementById('clue-book-back-cover-image').classList.toggle('mirrored',mirrorBack);
            setShape(document.getElementById('clue-book-cover'),'--clue-book-cover-shape',cover,'--clue-book-edge-color',clue.edgeColor || '#4a2d18');
            setShape(document.getElementById('clue-book-back-cover'),'--clue-book-back-shape',back,'--clue-book-back-edge-color',clue.backEdgeColor || '#4a2d18');
            applyBookThickness(clue);
            const open = Boolean(state.open);
            document.getElementById('clue-book-cover').classList.toggle('open',open);
            document.getElementById('clue-book').classList.toggle('open',open);
            renderSpread(state.spread);
            fitBaseSize(book3D,Number(state.aspect) > 0 ? state.aspect : 1.55,.87,.73);
        }

        function fitAndTransform() {
            if (!activeInspection) return;
            const clue = activeInspection.clue;
            const state = activeInspection.state || {};
            const isBook = clue.type === 'book';
            const element = isBook ? book3D : object3D;
            fitBaseSize(element,Number(state.aspect) > 0 ? state.aspect : (isBook ? 1.55 : 1.5),isBook ? .87 : .82,isBook ? .73 : .76);
            const zoom = clamp(state.zoom,.5,4,1);
            element.style.width = `${Number(element.dataset.baseWidth) * zoom}px`;
            element.style.height = `${Number(element.dataset.baseHeight) * zoom}px`;
            const rotationX = clamp(state.rotationX,-90,90,-8);
            const rotationY = clamp(state.rotationY,-100000,100000,0);
            const panX = clamp(state.panXRatio,-1.5,1.5,0) * window.innerWidth;
            const panY = clamp(state.panYRatio,-1.5,1.5,0) * window.innerHeight;
            if (isBook) {
                const open = Boolean(state.open);
                const closedOffset = open ? 0 : -25 * Math.cos(rotationY * Math.PI / 180);
                document.getElementById('clue-book-cover').classList.toggle('open',open);
                document.getElementById('clue-book').classList.toggle('open',open);
                element.style.transform = `translate(${panX}px,${panY}px) translateX(${closedOffset}%) rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            } else {
                element.style.transform = `translate(${panX}px,${panY}px) rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            }
        }

        function showInspection(data) {
            if (!data || normalizeTableCode(data.mesa) !== tableCode || !data.clue) return;
            inspectionTransitionSequence++;
            clearTimeout(root._hideTimer);
            root.classList.remove('active','leaving');
            void root.offsetWidth;
            activeInspection = { ...data,state: data.state && typeof data.state === 'object' ? { ...data.state } : {} };
            clearTimeout(pageTurnTimer);
            document.getElementById('inspection-title').textContent = String(data.clue.title || 'Pista');
            document.getElementById('inspection-player').textContent = `INSPEÇÃO DE ${String(data.jogador || 'JOGADOR')}`;
            if (data.clue.type === 'book') renderBook(data.clue,activeInspection.state);
            else renderObject(data.clue,activeInspection.state);
            fitAndTransform();
            root.classList.add('active');
            root.setAttribute('aria-hidden','false');
        }

        function updateInspection(data) {
            if (!activeInspection || !data || normalizeTableCode(data.mesa) !== tableCode) return;
            if (String(data.codigo || '') !== String(activeInspection.codigo || '') || String(data.clueId || '') !== String(activeInspection.clue.id || '')) return;
            const previous = activeInspection.state || {};
            const next = data.state && typeof data.state === 'object' ? { ...data.state } : previous;
            activeInspection.state = next;
            if (activeInspection.clue.type === 'book') {
                const targetSpread = Math.max(0,Math.floor(Number(next.spread) || 0));
                const direction = Math.sign(Number(next.turnDirection) || 0);
                if (targetSpread !== renderedSpread) {
                    if (next.open && direction && Math.abs(targetSpread - renderedSpread) === 2) animateSpread(targetSpread,direction);
                    else renderSpread(targetSpread);
                }
            }
            fitAndTransform();
        }

        function hideInspection(data) {
            if (data && normalizeTableCode(data.mesa) !== tableCode) return;
            if (data && data.codigo && activeInspection && String(data.codigo) !== String(activeInspection.codigo)) return;
            const transitionSequence = ++inspectionTransitionSequence;
            activeInspection = null;
            clearTimeout(pageTurnTimer);
            if (!root.classList.contains('active')) {
                root.classList.remove('leaving');
                root.setAttribute('aria-hidden','true');
                object3D.classList.remove('visible');
                book3D.classList.remove('visible');
                return;
            }
            root.classList.add('leaving');
            root._hideTimer = setTimeout(() => {
                if (transitionSequence !== inspectionTransitionSequence) return;
                root.classList.remove('active','leaving');
                root.setAttribute('aria-hidden','true');
                object3D.classList.remove('visible');
                book3D.classList.remove('visible');
            },620);
        }

        socket.on('connect',() => socket.emit('clue_overlay_ready',{ mesa: tableCode }));
        socket.on('clue_inspection_started',showInspection);
        socket.on('clue_inspection_updated',updateInspection);
        socket.on('clue_inspection_stopped',hideInspection);
        window.addEventListener('resize',fitAndTransform);
        if (!urlParams.get('mesa')) window.addEventListener('storage',event => {
            if (!tablePinned && event.key === 'master_table_code' && event.newValue) {
                tableCode = normalizeTableCode(event.newValue);
                document.getElementById('table-code').textContent = tableCode;
                localStorage.setItem('clue_overlay_table_code',tableCode);
                hideInspection();
                if (socket.connected) socket.emit('clue_overlay_ready',{ mesa: tableCode });
            }
        });
    </script>
</body>
</html>
