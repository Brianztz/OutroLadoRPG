<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay da Mesa</title>
    <style>
        @font-face {
            font-family: "ITC Krist";
            src: url("./ITCKRIST.TTF") format("truetype");
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --cyan: #00b8f5;
            --cyan-soft: rgba(0, 184, 245, 0.28);
            --red: #ec334d;
            --red-dark: #8b1028;
            --sanity: #7187ff;
            --sanity-dark: #303a9e;
            --gold: #ffc83d;
            --panel: rgba(10, 13, 18, 0.94);
            --line: rgba(197, 218, 231, 0.18);
            --muted: #91a0ab;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
            background: transparent;
        }

        body {
            padding: 24px;
            overflow: hidden;
            color: #fff;
            font-family: "ITC Krist", sans-serif;
        }

        .overlay-grid {
            display: grid;
            grid-template-columns: minmax(460px, 520px);
            gap: 14px;
            width: min(520px, calc(100vw - 48px));
            align-items: center;
            transition: opacity 0.38s ease, filter 0.38s ease, transform 0.38s ease;
        }

        body.clue-inspection-active .overlay-grid,
        body.clue-inspection-active .connection-state {
            opacity: 0;
            visibility: hidden;
            filter: blur(10px);
            transform: scale(0.97);
            pointer-events: none;
        }

        .clue-inspection-layer {
            position: fixed;
            z-index: 70;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            perspective: 1800px;
            transition: opacity 0.38s ease, visibility 0s linear 0.38s;
        }

        .clue-inspection-layer.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.38s ease;
        }

        .clue-inspection-stage {
            position: absolute;
            inset: 3vh 3vw 8vh;
            display: grid;
            place-items: center;
            perspective: 1800px;
            transform-style: preserve-3d;
        }

        .clue-inspection-shell {
            --inspection-half-depth: 9px;
            position: relative;
            display: none;
            transform-style: preserve-3d;
            transform-origin: center;
            will-change: transform;
            filter: drop-shadow(0 24px 24px rgba(0,0,0,0.72));
            transition: width 0.24s ease, height 0.24s ease;
        }

        .clue-inspection-shell.visible { display: block; }
        .clue-inspection-object-depth { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
        .clue-inspection-object-depth span { position: absolute; inset: 0; background: #3e444b; transform: translateZ(var(--inspection-layer-depth)); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
        .clue-inspection-face { position: absolute; inset: 0; display: grid; place-items: center; transform-style: preserve-3d; backface-visibility: hidden; }
        .clue-inspection-face.front { transform: translateZ(var(--inspection-half-depth)); }
        .clue-inspection-face.back { transform: rotateY(180deg) translateZ(var(--inspection-half-depth)); }
        .clue-inspection-face img { width: 100%; height: 100%; display: block; object-fit: contain; filter: drop-shadow(0 5px 7px rgba(0,0,0,0.45)); }
        .clue-inspection-fallback { position: absolute; inset: 0; display: none; place-items: center; color: rgba(255,255,255,0.72); font-size: clamp(3rem,9vw,8rem); }

        .clue-inspection-book-shell { transform-origin: center; }
        .inspection-book-closed,
        .inspection-book-open { position: absolute; inset: 0; transform-style: preserve-3d; }
        .inspection-book-closed { left: 25%; right: 25%; filter: drop-shadow(0 18px 18px rgba(0,0,0,0.7)); }
        .inspection-book-cover-face { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 1.5% 4% 4% 1.5%; background: #17120e; backface-visibility: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
        .inspection-book-cover-face.front { transform: translateZ(var(--inspection-half-depth)); }
        .inspection-book-cover-face.back { transform: rotateY(180deg) translateZ(var(--inspection-half-depth)); }
        .inspection-book-cover-face img,
        .inspection-book-cover-under img,
        .inspection-book-page img { width: 100%; height: 100%; display: block; object-fit: fill; }
        .inspection-book-open { display: none; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.72)); }
        .clue-inspection-book-shell.open .inspection-book-closed { display: none; }
        .clue-inspection-book-shell.open .inspection-book-open { display: block; }
        .inspection-book-cover-under { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 0; overflow: hidden; background: #20160f; }
        .inspection-book-cover-under.left { left: 0; transform: translateZ(var(--inspection-back-depth)); border-radius: 4% 1% 1% 4%; }
        .inspection-book-cover-under.right { right: 0; transform: translateZ(var(--inspection-back-depth)); border-radius: 1% 4% 4% 1%; }
        .inspection-book-cover-under.left img { transform: scaleX(-1); }
        .inspection-book-page { position: absolute; top: 2.7%; bottom: 2.7%; z-index: 2; width: 48.8%; display: grid; place-items: center; overflow: hidden; background: linear-gradient(90deg,#bca77d,#efe4c6 8%,#f5edda 90%,#aa936b); backface-visibility: visible; box-shadow: inset 0 0 18px rgba(58,37,18,0.22); }
        .inspection-book-page.left { left: 1.2%; transform: translateZ(calc(var(--inspection-half-depth) + 2px)) rotateY(2.5deg); transform-origin: right center; border-radius: 2.8% 0.8% 0.8% 2.8%; }
        .inspection-book-page.right { right: 1.2%; transform: translateZ(calc(var(--inspection-half-depth) + 2px)) rotateY(-2.5deg); transform-origin: left center; border-radius: 0.8% 2.8% 2.8% 0.8%; }
        .inspection-book-page.empty img { display: none; }
        .inspection-book-page-placeholder { display: none; color: rgba(41,28,18,0.58); font-size: clamp(0.8rem,1.8vw,1.35rem); letter-spacing: 1px; text-transform: uppercase; }
        .inspection-book-page.empty .inspection-book-page-placeholder { display: block; }
        .inspection-book-spine { position: absolute; z-index: 5; left: 50%; top: 1%; bottom: 1%; width: 2.3%; transform: translateX(-50%) translateZ(calc(var(--inspection-half-depth) + 4px)); border-radius: 50%; background: linear-gradient(90deg,rgba(51,31,15,0.75),rgba(9,6,4,0.95),rgba(68,42,20,0.72)); box-shadow: 0 0 12px rgba(0,0,0,0.8); }
        .clue-inspection-book-shell.page-changing .inspection-book-page.right { animation: inspection-page-turn 0.5s cubic-bezier(0.56,0.05,0.3,1); }

        .clue-inspection-caption {
            position: absolute;
            left: 50%;
            bottom: 2.4vh;
            display: grid;
            gap: 3px;
            min-width: 220px;
            padding: 9px 18px;
            border: 1px solid rgba(0,184,245,0.28);
            border-radius: 999px;
            background: rgba(4,8,13,0.74);
            box-shadow: 0 8px 25px rgba(0,0,0,0.46),0 0 18px rgba(0,184,245,0.09);
            text-align: center;
            transform: translateX(-50%);
        }
        .clue-inspection-caption strong { color: #eaf8ff; font-size: clamp(0.8rem,1.3vw,1.1rem); letter-spacing: 1.2px; text-transform: uppercase; }
        .clue-inspection-caption span { color: #7fcff0; font-size: clamp(0.55rem,0.8vw,0.72rem); letter-spacing: 0.7px; text-transform: uppercase; }

        .overlay-table-button {
            position: fixed;
            z-index: 100;
            top: 16px;
            right: 16px;
            padding: 8px 13px;
            border: 1px solid rgba(0, 184, 245, 0.55);
            border-radius: 999px;
            background: rgba(7, 10, 14, 0.78);
            box-shadow: 0 0 14px rgba(0, 184, 245, 0.14), 0 6px 18px rgba(0, 0, 0, 0.38);
            color: #a9bac4;
            font: 800 0.72rem/1 "ITC Krist", sans-serif;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.72;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .overlay-table-button:hover,
        .overlay-table-button:focus-visible {
            opacity: 1;
            border-color: var(--cyan);
            box-shadow: 0 0 18px rgba(0, 184, 245, 0.28), 0 6px 18px rgba(0, 0, 0, 0.42);
            transform: translateY(-1px);
            outline: none;
        }

        .overlay-table-button span { color: #fff; }
        .overlay-clue-button { right: 178px; color: #9edfff; }

        .player-widget {
            --player-color: #00b8f5;
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
            min-height: 200px;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.52));
            animation: widget-in 0.36s ease both;
        }

        .player-widget.leaving {
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .portrait {
            position: relative;
            top: -4px;
            z-index: 3;
            flex: 0 0 175px;
            width: 175px;
            height: 175px;
            overflow: visible;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            filter: drop-shadow(0 0 3px var(--player-color)) drop-shadow(0 0 8px var(--player-color));
            transform-origin: 50% 76%;
            will-change: transform;
            animation: portrait-breathe 4.2s ease-in-out infinite;
            transition: filter 0.75s ease, opacity 0.75s ease;
        }

        .portrait::before {
            content: none;
        }

        .portrait::after {
            content: "";
            position: absolute;
            z-index: 6;
            inset: 7% 0;
            border-radius: 0;
            opacity: 0;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
        }

        .portrait::after {
            background:
                repeating-linear-gradient(0deg, transparent 0 5px, rgba(106, 80, 255, 0.48) 6px 8px, transparent 9px 13px),
                linear-gradient(90deg, rgba(29, 199, 255, 0.32), rgba(153, 62, 255, 0.38));
            mix-blend-mode: screen;
        }

        .portrait img {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            backface-visibility: hidden;
            transform: translateZ(0) scale(1.04);
            transition: opacity 0.65s ease;
        }

        .portrait img.active {
            opacity: 1;
        }

        .portrait-remove {
            position: absolute;
            top: 10px;
            right: 4px;
            z-index: 20;
            width: 29px;
            height: 29px;
            padding: 0;
            border: 1px solid rgba(255, 75, 86, 0.72);
            border-radius: 50%;
            background: rgba(15, 7, 9, 0.88);
            color: #ff6570;
            font-size: 1rem;
            font-weight: 900;
            line-height: 27px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.82);
            transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease;
        }

        .player-widget:hover .portrait-remove,
        .portrait-remove:focus-visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .portrait-remove:hover {
            background: #d7192d;
            color: white;
        }

        .player-widget.damage-hit .portrait {
            animation: damage-portrait-impact 0.62s cubic-bezier(0.2, 0.85, 0.25, 1) both;
        }

        .player-widget.damage-hit .display-stack {
            animation: damage-impact 0.62s cubic-bezier(0.2, 0.85, 0.25, 1) both;
        }

        .player-widget.sanity-hit .portrait::after {
            animation: sanity-interference 0.92s steps(2, end) both;
        }

        .player-widget.sanity-hit .portrait img.active {
            animation: sanity-image-glitch 0.92s steps(2, end) both;
        }

        .player-widget.unconscious .portrait,
        .player-widget.dying .portrait {
            animation: none;
            filter: grayscale(1) brightness(0.58) contrast(1.08) drop-shadow(0 0 3px rgba(110, 120, 132, 0.4));
            opacity: 0.9;
        }

        .player-widget.unconscious .portrait img {
            filter: grayscale(1) brightness(0.8);
            transition: opacity 0.65s ease, filter 0.75s ease;
        }

        .player-widget.dying .portrait img {
            filter: grayscale(1) brightness(0) !important;
            animation: none;
            transition: opacity 0.65s ease, filter 0.75s ease;
        }

        .player-widget.unconscious .display-stack,
        .player-widget.dying .display-stack {
            opacity: 0.68;
            filter: grayscale(0.78) brightness(0.8);
            transition: opacity 0.75s ease, filter 0.75s ease;
        }

        .portrait-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2.6rem;
            font-weight: 900;
        }

        .display-stack {
            position: relative;
            z-index: 2;
            display: grid;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 76px;
            margin-left: 0;
            align-items: center;
            top: -10px;
        }

        .identity {
            grid-area: 1 / 1;
            min-width: 0;
            opacity: 1;
            visibility: visible;
            filter: blur(0);
            transform: translateX(0) scale(1);
            transition: opacity 0.72s ease, filter 0.72s ease, transform 0.72s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
        }

        .identity.hidden {
            opacity: 0;
            visibility: hidden;
            filter: blur(8px);
            transform: translateX(-18px) scale(0.92);
            transition: opacity 0.72s ease, filter 0.72s ease, transform 0.72s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.72s;
        }

        .name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            overflow: visible;
            color: #f6fbff;
            font-family: "ITC Krist", sans-serif;
            max-width: 260px;
            padding: 3px 5px 0.22em 0;
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.04;
            letter-spacing: 1.25px;
            text-transform: uppercase;
            white-space: normal;
            overflow-wrap: anywhere;
            text-shadow:
                0 2px 3px #000,
                0 0 4px var(--player-color),
                0 0 9px var(--player-color);
            transform: translateX(0) rotate(-2deg);
        }

        .name-line { display: block; overflow: visible; padding-bottom: 0.08em; }
        .name-line + .name-line { margin-top: 2px; padding-bottom: 0.14em; font-size: 0.72em; line-height: 1.05; }

        .combat-stats {
            grid-area: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-left: 0;
            opacity: 0;
            visibility: hidden;
            filter: blur(10px) brightness(1.55);
            clip-path: inset(0 100% 0 0);
            transform: translateX(24px) scale(0.9);
            transition: opacity 0.76s ease, filter 0.76s ease, clip-path 0.76s cubic-bezier(0.22, 0.78, 0.18, 1), transform 0.76s cubic-bezier(0.22, 0.78, 0.18, 1), visibility 0s linear 0.76s;
            pointer-events: none;
        }

        .combat-stats.active {
            opacity: 1;
            visibility: visible;
            filter: blur(0);
            clip-path: inset(0 0 0 0);
            transform: translateX(0) scale(1);
            transition: opacity 0.76s ease, filter 0.76s ease, clip-path 0.76s cubic-bezier(0.22, 0.78, 0.18, 1), transform 0.76s cubic-bezier(0.22, 0.78, 0.18, 1), visibility 0s;
        }

        .player-widget.combat-entering .combat-stats.active {
            animation: combat-stats-arrive 0.9s cubic-bezier(0.16, 0.88, 0.2, 1) both;
        }

        .combat-number {
            display: flex;
            align-items: baseline;
            gap: 9px;
            color: #fff;
            font-family: "ITC Krist", sans-serif;
            font-size: 2.15rem;
            font-weight: 700;
            line-height: 0.96;
            letter-spacing: -1px;
            white-space: nowrap;
            text-shadow: 0 2px 3px #000;
        }

        .combat-prefix {
            width: 27px;
            font-family: "ITC Krist", sans-serif;
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-align: right;
        }

        .combat-number.life {
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(255,45,55,0.9), 0 0 10px rgba(255,45,55,0.45);
        }

        .combat-number.sanity {
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(92,117,255,0.9), 0 0 10px rgba(92,117,255,0.48);
        }

        .combat-number.ammo {
            align-items: center;
            margin-bottom: 4px;
            color: #ffe47c;
            font-family: "ITC Krist", sans-serif;
            font-size: 1.72rem;
            letter-spacing: 0;
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(255,200,61,0.88), 0 0 10px rgba(255,200,61,0.4);
        }

        .combat-number.ammo[hidden] { display: none; }

        .ammo-icon {
            width: 44px;
            height: 44px;
            margin: -8px -6px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px #000) drop-shadow(0 0 5px rgba(255,200,61,0.6));
        }

        .ammo-icon[hidden], .ammo-text-prefix[hidden] { display: none; }

        .ammo-value { display: inline-flex; align-items: center; line-height: 1; }

        .combat-number.ammo.empty {
            color: #ff8d99;
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(236,51,77,0.9), 0 0 10px rgba(236,51,77,0.45);
        }

        .combat-number.ammo.low:not(.empty) {
            animation: ammo-low-warning 0.92s ease-in-out infinite;
        }

        .combat-number.ammo.empty {
            animation: none;
            color: #ff3e55;
            filter: saturate(1.25) brightness(1.08);
        }

        .player-widget.active-turn:not(.unconscious):not(.dying) .portrait {
            filter:
                drop-shadow(0 0 4px var(--player-color))
                drop-shadow(0 0 11px var(--player-color))
                drop-shadow(0 0 20px var(--player-color));
        }

        .connection-state {
            display: none;
            width: max-content;
            max-width: calc(100vw - 48px);
            padding: 10px 14px;
            border: 1px solid rgba(0,184,245,0.35);
            border-radius: 8px;
            background: rgba(7,10,14,0.88);
            box-shadow: 0 8px 22px rgba(0,0,0,0.45);
            color: #a9bac4;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .connection-state.visible { display: block; }
        .connection-state.error { border-color: rgba(236,51,77,0.6); color: #ff9aaa; }

        .combat-number.changed { animation: number-flash 0.65s ease; }

        @keyframes widget-in {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes inspection-page-turn {
            0% { filter: brightness(1); transform: translateZ(calc(var(--inspection-half-depth) + 2px)) rotateY(-2.5deg); }
            45% { filter: brightness(0.72); transform: translateZ(calc(var(--inspection-half-depth) + 18px)) rotateY(-78deg); }
            100% { filter: brightness(1); transform: translateZ(calc(var(--inspection-half-depth) + 2px)) rotateY(-2.5deg); }
        }

        @keyframes number-flash {
            0%, 100% { filter: brightness(1); }
            45% { filter: brightness(1.8); }
        }

        @keyframes damage-impact {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            12% { transform: translate3d(-5px, 1px, 0) scale(1.035); }
            28% { transform: translate3d(5px, -1px, 0) scale(0.985); }
            46% { transform: translate3d(-3px, 0, 0) scale(1.018); }
            68% { transform: translate3d(2px, 0, 0) scale(0.995); }
        }

        @keyframes damage-portrait-impact {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
                filter: drop-shadow(0 0 3px var(--player-color)) drop-shadow(0 0 8px var(--player-color));
            }
            12% {
                transform: translate3d(-5px, 1px, 0) scale(1.045);
                filter: drop-shadow(0 0 5px #ff253f) drop-shadow(0 0 15px #e00626) drop-shadow(0 0 24px rgba(255, 28, 56, 0.82));
            }
            28% {
                transform: translate3d(5px, -1px, 0) scale(0.985);
                filter: drop-shadow(0 0 4px #ff4b5f) drop-shadow(0 0 11px rgba(220, 0, 28, 0.82));
            }
            46% {
                transform: translate3d(-3px, 0, 0) scale(1.022);
                filter: drop-shadow(0 0 4px #ff354d) drop-shadow(0 0 9px rgba(220, 0, 28, 0.72));
            }
            68% {
                transform: translate3d(2px, 0, 0) scale(0.997);
                filter: drop-shadow(0 0 3px var(--player-color)) drop-shadow(0 0 8px var(--player-color));
            }
        }

        @keyframes sanity-interference {
            0%, 100% { opacity: 0; transform: translateX(0); clip-path: inset(0 0 0 0); }
            12% { opacity: 0.86; transform: translateX(-4px); clip-path: inset(12% 0 48% 0); }
            28% { opacity: 0.48; transform: translateX(5px); clip-path: inset(55% 0 8% 0); }
            46% { opacity: 0.92; transform: translateX(-2px); clip-path: inset(28% 0 31% 0); }
            66% { opacity: 0.38; transform: translateX(3px); clip-path: inset(4% 0 70% 0); }
            82% { opacity: 0.68; transform: translateX(-1px); clip-path: inset(68% 0 4% 0); }
        }

        @keyframes sanity-image-glitch {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1.12); filter: none; }
            16% { transform: translate3d(-4px, 1px, 0) scale(1.155); filter: hue-rotate(35deg) saturate(1.7); }
            34% { transform: translate3d(5px, -1px, 0) scale(1.145); filter: hue-rotate(225deg) saturate(1.45); }
            52% { transform: translate3d(-2px, 0, 0) scale(1.165); filter: hue-rotate(285deg) contrast(1.35); }
            72% { transform: translate3d(3px, 1px, 0) scale(1.13); filter: hue-rotate(175deg) saturate(1.6); }
        }

        @keyframes ammo-low-warning {
            0%, 100% { color: #ffe47c; filter: brightness(0.92); transform: scale(1); }
            50% { color: #fff1a6; filter: brightness(1.65); transform: scale(1.045); text-shadow: 0 2px 3px #000, 0 0 8px rgba(255, 205, 47, 1), 0 0 17px rgba(255, 174, 0, 0.72); }
        }

        @keyframes combat-stats-arrive {
            0% { opacity: 0; filter: blur(12px) brightness(2.2); clip-path: inset(0 100% 0 0); transform: translateX(30px) scale(0.86); }
            58% { opacity: 1; filter: blur(0) brightness(1.28); clip-path: inset(0 0 0 0); transform: translateX(-3px) scale(1.035); }
            100% { opacity: 1; filter: blur(0) brightness(1); clip-path: inset(0 0 0 0); transform: translateX(0) scale(1); }
        }

        @keyframes portrait-breathe {
            0%, 100% {
                transform: translate3d(0, 1px, 0) rotate(-0.35deg) scale(0.992);
            }
            25% {
                transform: translate3d(1px, -2px, 0) rotate(0.15deg) scale(1.006);
            }
            50% {
                transform: translate3d(0, -5px, 0) rotate(0.45deg) scale(1.022);
            }
            75% {
                transform: translate3d(-1px, -2px, 0) rotate(0deg) scale(1.006);
            }
        }

        @media (max-width: 1050px) {
            .overlay-grid { grid-template-columns: minmax(0, 520px); }
        }

        @media (max-width: 560px) {
            body { padding: 12px; }
            .overlay-grid { width: calc(100vw - 24px); grid-template-columns: minmax(0, 1fr); }
            .player-widget { min-height: 178px; }
            .portrait { flex-basis: 160px; width: 160px; height: 160px; }
            .display-stack { min-height: 65px; margin-left: 0; top: -7px; }
            .name { font-size: 2rem; }
            .combat-number { font-size: 1.75rem; }
            .overlay-table-button { top: 8px; right: 8px; padding: 6px 9px; font-size: 0.58rem; }
            .overlay-clue-button { right: 138px; }
        }

        @media (hover: none) {
            .portrait-remove { opacity: 0.78; pointer-events: auto; transform: scale(0.92); }
        }
    </style>
</head>
<body>
    <button id="overlay-table-button" class="overlay-table-button" type="button" onclick="chooseOverlayTable()" title="Escolher a mesa exibida no overlay">MESA: <span id="overlay-table-code">PADRAO</span></button>
    <button class="overlay-table-button overlay-clue-button" type="button" onclick="openClueOverlayTab()" title="Abrir o overlay dedicado às pistas">PISTAS ↗</button>
    <section id="clue-inspection-layer" class="clue-inspection-layer" aria-hidden="true">
        <div id="clue-inspection-stage" class="clue-inspection-stage">
            <div id="clue-inspection-object" class="clue-inspection-shell clue-inspection-object-shell">
                <div id="clue-inspection-object-depth" class="clue-inspection-object-depth" aria-hidden="true"></div>
                <div class="clue-inspection-face front"><img id="clue-inspection-front-image" alt="Frente da pista"><div id="clue-inspection-front-fallback" class="clue-inspection-fallback">🔎</div></div>
                <div class="clue-inspection-face back"><img id="clue-inspection-back-image" alt="Verso da pista"><div id="clue-inspection-back-fallback" class="clue-inspection-fallback">🔎</div></div>
            </div>
            <div id="clue-inspection-book" class="clue-inspection-shell clue-inspection-book-shell">
                <div class="inspection-book-closed">
                    <div class="inspection-book-cover-face front"><img id="inspection-book-cover" alt="Capa do livro"><div class="clue-inspection-fallback">📖</div></div>
                    <div class="inspection-book-cover-face back"><img id="inspection-book-back" alt="Contracapa do livro"><div class="clue-inspection-fallback">📖</div></div>
                </div>
                <div class="inspection-book-open">
                    <div class="inspection-book-cover-under left"><img id="inspection-book-under-left" alt="Parte interna da capa"></div>
                    <div class="inspection-book-cover-under right"><img id="inspection-book-under-right" alt="Parte interna da contracapa"></div>
                    <div id="inspection-book-left-page" class="inspection-book-page left"><img alt="Página esquerda"><span class="inspection-book-page-placeholder">Página em branco</span></div>
                    <div id="inspection-book-right-page" class="inspection-book-page right"><img alt="Página direita"><span class="inspection-book-page-placeholder">Fim do livro</span></div>
                    <div class="inspection-book-spine" aria-hidden="true"></div>
                </div>
            </div>
        </div>
        <div class="clue-inspection-caption"><strong id="clue-inspection-title">PISTA</strong><span id="clue-inspection-player">INSPEÇÃO AO VIVO</span></div>
    </section>
    <main id="overlay-grid" class="overlay-grid" aria-live="polite"></main>
    <div id="connection-state" class="connection-state visible" role="status">Conectando ao servidor...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const grid = document.getElementById('overlay-grid');
        const connectionState = document.getElementById('connection-state');
        const overlayTableCode = document.getElementById('overlay-table-code');
        const players = new Map();
        const previousVitals = new Map();
        const clueInspectionLayer = document.getElementById('clue-inspection-layer');
        const clueInspectionObject = document.getElementById('clue-inspection-object');
        const clueInspectionBook = document.getElementById('clue-inspection-book');
        let activeClueInspection = null;
        let initiativeState = { entries: [], activeId: null, round: 0, started: false };
        const overlayUrlParams = new URLSearchParams(window.location.search);
        const overlayTableFromUrl = overlayUrlParams.get('mesa');
        let overlayTablePinned = Boolean(overlayTableFromUrl);
        let tableCode = normalizeTableCode(overlayTableFromUrl || localStorage.getItem('overlay_table_code') || localStorage.getItem('master_table_code') || 'PADRAO');
        let stablePlayerOrder = loadPlayerOrder(tableCode);
        let manuallyHiddenPlayers = loadHiddenPlayers(tableCode);
        localStorage.setItem('overlay_table_code', tableCode);
        const ammoIcons = {
            light: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjZ4l-yL1koYZgphvunMSkAIAG1b5Y-kRGD1FDCa4NYXgUmnK5zd0lQ4L2rXGGR7fVcqMzyi7zeGl4uALRwnSciJTRO_RoeGpnM0MvHcQg6B8VAP9FYJXM7loiWxw5M4P1ppT3Y7fI988i66gvHyKmLwO1FXdqgIisZUkrT5t3jT4swFn2mtBU0YN_HDIlj/s320/Muni%C3%A7%C3%A3o%20de%20Pistola.png',
            long: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh4Gbg5h1YE1QbOrGtbUDGne4ND4r-bblO6TSVF97zK69AzvJHlwTtM3ywhUCKpYJn8rlpjcskhnD92w9nRcNTAI7QO-1Ah_VkvT0LCr5GK-_BonkUnfQrZM9bY9rHaKWn5Pc0QiCBt5ISLZg4GiwYGd8jXoMjrkoMHCP4jzBDc_l7t9Fh3jfkj_SG8m1_E/s320/Muni%C3%A7%C3%A3o%20Longa.png',
            heavy: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCTDQJKWwpqDv-PTxw8q_bvKKvtnNAw6j3J2qte7CTtVDFLeFe_gtQK-xNbDUGYzyeGAAXNa-Wvnk4Z0wr5jmKOEjFya0fuzhF9ROQIaojydXG6gQIKfbYnlrMY2SpskCuXuQtzL7sZjn8kO0AyreCDk-U-OiOEaFcurIUBgRI2UNvUWxqdTorb9YkY-Qi/s320/Muni%C3%A7%C3%A3o%20Pesada.png'
        };

        function normalizeTableCode(value) {
            const normalized = String(value || 'PADRAO').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase().replace(/[^A-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
            return normalized || 'PADRAO';
        }

        function clampInspectionNumber(value, minimum, maximum, fallback = 0) {
            const number = Number(value);
            return Math.max(minimum, Math.min(maximum, Number.isFinite(number) ? number : fallback));
        }

        function setInspectionImage(image, source, onLoad) {
            if (!image) return;
            const fallback = image.parentElement && image.parentElement.querySelector('.clue-inspection-fallback');
            const safeSource = String(source || '');
            if (!safeSource) {
                image.removeAttribute('src');
                image.style.display = 'none';
                if (fallback) fallback.style.display = 'grid';
                return;
            }
            image.style.display = 'block';
            if (fallback) fallback.style.display = 'none';
            image.onload = () => {
                image.style.display = 'block';
                if (fallback) fallback.style.display = 'none';
                if (typeof onLoad === 'function') onLoad(image);
            };
            image.onerror = () => {
                image.style.display = 'none';
                if (fallback) fallback.style.display = 'grid';
            };
            if (image.getAttribute('src') !== safeSource) image.src = safeSource;
            else if (image.complete && image.naturalWidth && typeof onLoad === 'function') onLoad(image);
        }

        function setInspectionPage(element, page, emptyLabel) {
            if (!element) return;
            const image = element.querySelector('img');
            const source = String(page && (page.img || page.src) || '');
            element.classList.toggle('empty', !source);
            const placeholder = element.querySelector('.inspection-book-page-placeholder');
            if (placeholder) placeholder.textContent = emptyLabel;
            if (!source) {
                image.removeAttribute('src');
                image.style.display = 'none';
                return;
            }
            image.style.display = 'block';
            image.onerror = () => {
                element.classList.add('empty');
                image.style.display = 'none';
                if (placeholder) placeholder.textContent = 'Imagem indisponível';
            };
            if (image.getAttribute('src') !== source) image.src = source;
        }

        function fitClueInspectionShell() {
            if (!activeClueInspection) return;
            const state = activeClueInspection.state || {};
            const isBook = activeClueInspection.clue && activeClueInspection.clue.type === 'book';
            const shell = isBook ? clueInspectionBook : clueInspectionObject;
            const defaultAspect = isBook ? 1.55 : 1.5;
            const rawAspect = Number(state.aspect);
            const aspect = Number.isFinite(rawAspect) && rawAspect > 0 ? clampInspectionNumber(rawAspect, 0.25, 8, defaultAspect) : defaultAspect;
            const maximumWidth = window.innerWidth * (isBook ? 0.82 : 0.72);
            const maximumHeight = window.innerHeight * 0.78;
            let width = maximumWidth;
            let height = width / aspect;
            if (height > maximumHeight) {
                height = maximumHeight;
                width = height * aspect;
            }
            shell.style.width = `${Math.max(100, width)}px`;
            shell.style.height = `${Math.max(100, height)}px`;
        }

        function applyClueInspectionTransform() {
            if (!activeClueInspection) return;
            const clue = activeClueInspection.clue || {};
            const state = activeClueInspection.state || {};
            const shell = clue.type === 'book' ? clueInspectionBook : clueInspectionObject;
            const rotationX = clampInspectionNumber(state.rotationX, -90, 90, -8);
            const rotationY = clampInspectionNumber(state.rotationY, -100000, 100000, 0);
            const zoom = clampInspectionNumber(state.zoom, 0.5, 4, 1);
            const panX = clampInspectionNumber(state.panXRatio, -1.5, 1.5, 0) * window.innerWidth;
            const panY = clampInspectionNumber(state.panYRatio, -1.5, 1.5, 0) * window.innerHeight;
            shell.style.transform = `translate(${panX}px, ${panY}px) rotateX(${rotationX}deg) rotateY(${rotationY}deg) scale(${zoom})`;
            if (clue.type === 'book') clueInspectionBook.classList.toggle('open', Boolean(state.open));
        }

        function buildInspectionObjectDepth(source, thickness) {
            const container = document.getElementById('clue-inspection-object-depth');
            const safeThickness = Math.max(4, Math.min(40, Math.round(Number(thickness) || 18)));
            const half = safeThickness / 2;
            clueInspectionObject.style.setProperty('--inspection-half-depth', `${half}px`);
            clueInspectionObject.style.setProperty('--inspection-back-depth', `${-half}px`);
            container.replaceChildren();
            if (!source) return;
            const fragment = document.createDocumentFragment();
            for (let depth = -half; depth <= half; depth += 1) {
                const layer = document.createElement('span');
                layer.style.setProperty('--inspection-layer-depth', `${depth}px`);
                layer.style.webkitMaskImage = `url(${JSON.stringify(source)})`;
                layer.style.maskImage = `url(${JSON.stringify(source)})`;
                layer.style.filter = `brightness(${0.58 + (1 - Math.abs(depth) / Math.max(1, half)) * 0.38})`;
                fragment.appendChild(layer);
            }
            container.appendChild(fragment);
        }

        function renderInspectionObject(clue) {
            clueInspectionBook.classList.remove('visible', 'open', 'page-changing');
            clueInspectionObject.classList.add('visible');
            const frontSource = String(clue.img || '');
            const backSource = String(clue.backImg || frontSource);
            const updateNaturalAspect = image => {
                if (!activeClueInspection || Number(activeClueInspection.state && activeClueInspection.state.aspect) > 0) return;
                activeClueInspection.state.aspect = image.naturalWidth / Math.max(1, image.naturalHeight);
                fitClueInspectionShell();
                applyClueInspectionTransform();
            };
            setInspectionImage(document.getElementById('clue-inspection-front-image'), frontSource, updateNaturalAspect);
            setInspectionImage(document.getElementById('clue-inspection-back-image'), backSource);
            buildInspectionObjectDepth(frontSource, clue.thickness);
        }

        function renderInspectionBookPages(animate = false) {
            if (!activeClueInspection || activeClueInspection.clue.type !== 'book') return;
            const pages = Array.isArray(activeClueInspection.clue.pages) ? activeClueInspection.clue.pages : [];
            const spread = Math.max(0, Math.floor(Number(activeClueInspection.state && activeClueInspection.state.spread) || 0));
            setInspectionPage(document.getElementById('inspection-book-left-page'), pages[spread], 'Livro vazio');
            setInspectionPage(document.getElementById('inspection-book-right-page'), pages[spread + 1], 'Fim do livro');
            if (animate) {
                clueInspectionBook.classList.remove('page-changing');
                void clueInspectionBook.offsetWidth;
                clueInspectionBook.classList.add('page-changing');
                clearTimeout(clueInspectionBook._pageTimer);
                clueInspectionBook._pageTimer = setTimeout(() => clueInspectionBook.classList.remove('page-changing'), 520);
            }
        }

        function renderInspectionBook(clue) {
            clueInspectionObject.classList.remove('visible');
            clueInspectionBook.classList.add('visible');
            const coverSource = String(clue.coverImg || ((clue.pages || [])[0] || {}).img || '');
            const backSource = String(clue.coverBackImg || coverSource);
            const setPlainImage = (id, source) => {
                const image = document.getElementById(id);
                if (!image) return;
                if (source) {
                    image.style.display = 'block';
                    image.src = source;
                    image.onerror = () => { image.style.display = 'none'; };
                } else {
                    image.removeAttribute('src');
                    image.style.display = 'none';
                }
            };
            setInspectionImage(document.getElementById('inspection-book-cover'), coverSource);
            setInspectionImage(document.getElementById('inspection-book-back'), backSource);
            setPlainImage('inspection-book-under-left', coverSource);
            setPlainImage('inspection-book-under-right', backSource);
            const thickness = Math.max(4, Math.min(40, Number(clue.thickness) || 18));
            clueInspectionBook.style.setProperty('--inspection-half-depth', `${thickness / 2}px`);
            clueInspectionBook.style.setProperty('--inspection-back-depth', `${-thickness / 2}px`);
            renderInspectionBookPages(false);
        }

        function showClueInspection(data) {
            if (!data || normalizeTableCode(data.mesa) !== tableCode || !data.clue) return;
            activeClueInspection = {
                ...data,
                clue: data.clue,
                state: data.state && typeof data.state === 'object' ? { ...data.state } : {}
            };
            document.getElementById('clue-inspection-title').textContent = String(data.clue.title || 'Pista');
            document.getElementById('clue-inspection-player').textContent = `INSPEÇÃO DE ${String(data.jogador || 'JOGADOR')}`;
            document.body.classList.add('clue-inspection-active');
            clueInspectionLayer.classList.add('active');
            clueInspectionLayer.setAttribute('aria-hidden', 'false');
            if (data.clue.type === 'book') renderInspectionBook(data.clue);
            else renderInspectionObject(data.clue);
            fitClueInspectionShell();
            applyClueInspectionTransform();
        }

        function updateClueInspection(data) {
            if (!activeClueInspection || !data || normalizeTableCode(data.mesa) !== tableCode) return;
            if (String(data.codigo || '') !== String(activeClueInspection.codigo || '')) return;
            if (data.clueId && String(data.clueId) !== String(activeClueInspection.clue.id)) return;
            const previousSpread = Number(activeClueInspection.state && activeClueInspection.state.spread) || 0;
            const previousOpen = Boolean(activeClueInspection.state && activeClueInspection.state.open);
            activeClueInspection.state = data.state && typeof data.state === 'object' ? { ...data.state } : activeClueInspection.state;
            const nextSpread = Number(activeClueInspection.state && activeClueInspection.state.spread) || 0;
            const nextOpen = Boolean(activeClueInspection.state && activeClueInspection.state.open);
            if (activeClueInspection.clue.type === 'book' && (nextSpread !== previousSpread || nextOpen !== previousOpen)) {
                renderInspectionBookPages(nextSpread !== previousSpread);
            }
            fitClueInspectionShell();
            applyClueInspectionTransform();
        }

        function hideClueInspection(data) {
            if (data && normalizeTableCode(data.mesa) !== tableCode) return;
            if (data && data.codigo && activeClueInspection && String(data.codigo) !== String(activeClueInspection.codigo)) return;
            activeClueInspection = null;
            document.body.classList.remove('clue-inspection-active');
            clueInspectionLayer.classList.remove('active');
            clueInspectionLayer.setAttribute('aria-hidden', 'true');
            clueInspectionObject.classList.remove('visible');
            clueInspectionBook.classList.remove('visible', 'open', 'page-changing');
        }

        function playerOrderStorageKey(table) {
            return `overlay_player_order_${normalizeTableCode(table)}`;
        }

        function loadPlayerOrder(table) {
            try {
                const storedOrder = JSON.parse(localStorage.getItem(playerOrderStorageKey(table)) || '[]');
                if (!Array.isArray(storedOrder)) return [];
                return [...new Set(storedOrder.map(code => String(code || '').trim().toUpperCase()).filter(Boolean))];
            } catch (_) {
                return [];
            }
        }

        function savePlayerOrder() {
            localStorage.setItem(playerOrderStorageKey(tableCode), JSON.stringify(stablePlayerOrder));
        }

        function hiddenPlayersStorageKey(table) {
            return `overlay_hidden_players_${normalizeTableCode(table)}`;
        }

        function loadHiddenPlayers(table) {
            try {
                const storedCodes = JSON.parse(localStorage.getItem(hiddenPlayersStorageKey(table)) || '[]');
                if (!Array.isArray(storedCodes)) return new Set();
                return new Set(storedCodes.map(code => String(code || '').trim().toUpperCase()).filter(Boolean));
            } catch (_) {
                return new Set();
            }
        }

        function saveHiddenPlayers() {
            localStorage.setItem(hiddenPlayersStorageKey(tableCode), JSON.stringify([...manuallyHiddenPlayers]));
        }

        function ensureStablePlayerPosition(code) {
            if (stablePlayerOrder.includes(code)) return;
            stablePlayerOrder.push(code);
            savePlayerOrder();
        }

        function safeNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function getAmmoIcon(ammoType) {
            const type = String(ammoType || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            if (/pesad/.test(type)) return { src: ammoIcons.heavy, alt: 'Munição pesada' };
            if (/long/.test(type)) return { src: ammoIcons.long, alt: 'Munição longa' };
            if (/curt|leve/.test(type)) return { src: ammoIcons.light, alt: 'Munição leve' };
            return null;
        }

        function normalizePlayerColor(value) {
            const color = String(value || '').trim();
            if (/^#[0-9a-f]{6}$/i.test(color)) return color;
            if (/^#[0-9a-f]{3}$/i.test(color)) {
                return `#${color.slice(1).split('').map(char => char + char).join('')}`;
            }
            return '#00b8f5';
        }

        function playerCode(data) {
            return String(data && (data.codigo || data.id) || '').trim().toUpperCase();
        }

        function isActiveFlag(value) {
            return value === true || value === 'true' || value === 1 || value === '1';
        }

        function setConnectionMessage(message, type = '') {
            connectionState.textContent = message;
            connectionState.className = `connection-state visible${type ? ` ${type}` : ''}`;
        }

        function hideConnectionMessage() {
            connectionState.className = 'connection-state';
        }

        function chooseOverlayTable() {
            const value = window.prompt('Digite o nome ou código da mesa que o overlay deve mostrar:', tableCode);
            if (value === null) return;
            const nextTable = normalizeTableCode(value);
            overlayTablePinned = true;
            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('mesa', nextTable);
            window.history.replaceState(null, '', nextUrl);
            switchOverlayTable(nextTable);
        }

        function openClueOverlayTab() {
            const clueOverlayUrl = new URL('./overlay-pistas.html', window.location.href);
            clueOverlayUrl.searchParams.set('mesa', tableCode);
            window.open(clueOverlayUrl.href, '_blank', 'noopener');
        }

        function switchOverlayTable(value) {
            const nextTable = normalizeTableCode(value);
            overlayTableCode.textContent = nextTable;
            if (nextTable === tableCode) {
                localStorage.setItem('overlay_table_code', nextTable);
                return;
            }
            hideClueInspection();
            tableCode = nextTable;
            localStorage.setItem('overlay_table_code', tableCode);
            stablePlayerOrder = loadPlayerOrder(tableCode);
            manuallyHiddenPlayers = loadHiddenPlayers(tableCode);
            players.clear();
            previousVitals.clear();
            grid.replaceChildren();
            initiativeState = { entries: [], activeId: null, round: 0, started: false };
            setConnectionMessage(`Buscando jogadores da mesa ${tableCode}...`);
            if (socket.connected) socket.emit('overlay_ready', { mesa: tableCode });
        }

        overlayTableCode.textContent = tableCode;

        function renderPlayerName(element, name) {
            const parts = String(name || 'Personagem').trim().split(/\s+/).filter(Boolean);
            element.replaceChildren(...parts.map(part => {
                const line = document.createElement('span');
                line.className = 'name-line';
                line.textContent = part;
                return line;
            }));
        }

        function createPlayerWidget(code) {
            const article = document.createElement('article');
            article.className = 'player-widget';
            article.dataset.code = code;
            article.innerHTML = `
                <div class="portrait">
                    <div class="portrait-fallback">?</div>
                    <img class="portrait-image" data-layer="a" alt="" hidden>
                    <img class="portrait-image" data-layer="b" alt="" hidden>
                    <button class="portrait-remove" type="button" title="Remover do overlay até o jogador reconectar" aria-label="Remover jogador do overlay">×</button>
                </div>
                <div class="display-stack">
                    <div class="identity">
                        <div class="name">Personagem</div>
                    </div>
                    <div class="combat-stats" aria-label="Vida e sanidade">
                        <span class="combat-number ammo" hidden><span class="combat-prefix ammo-text-prefix">MUN</span><img class="ammo-icon" alt="" hidden><span class="ammo-value">0</span></span>
                        <span class="combat-number life" title="Vida"><span class="life-value">0/0</span></span>
                        <span class="combat-number sanity" title="Sanidade"><span class="sanity-value">0/0</span></span>
                    </div>
                </div>`;

            article.querySelector('.portrait-remove').addEventListener('click', event => {
                event.stopPropagation();
                hidePlayerUntilReconnect(code);
            });

            return article;
        }

        function flashCombatNumber(article, selector, changed) {
            const number = article.querySelector(selector);
            if (changed) {
                if (number._flashTimer) clearTimeout(number._flashTimer);
                number.classList.remove('changed');
                void number.offsetWidth;
                number.classList.add('changed');
                number._flashTimer = setTimeout(() => number.classList.remove('changed'), 680);
            }
        }

        function restartTimedEffect(element, className, duration) {
            if (!element._overlayEffectTimers) element._overlayEffectTimers = {};
            if (element._overlayEffectTimers[className]) clearTimeout(element._overlayEffectTimers[className]);
            element.classList.remove(className);
            void element.offsetWidth;
            element.classList.add(className);
            element._overlayEffectTimers[className] = setTimeout(() => {
                element.classList.remove(className);
                delete element._overlayEffectTimers[className];
            }, duration);
        }

        function updatePlayerWidget(data) {
            const code = playerCode(data);
            if (!code) return;
            ensureStablePlayerPosition(code);
            players.set(code, data);

            if (manuallyHiddenPlayers.has(code)) {
                const hiddenArticle = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
                if (hiddenArticle) hiddenArticle.remove();
                return;
            }

            let article = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
            if (!article) {
                article = createPlayerWidget(code);
                grid.appendChild(article);
            }

            const name = String(data.nome || 'Personagem sem nome');
            const lifeCurrent = safeNumber(data.vida_atual);
            const lifeMaximum = Math.max(0, safeNumber(data.vida_max));
            const sanityCurrent = safeNumber(data.sani_atual);
            const sanityMaximum = Math.max(0, safeNumber(data.sani_max));
            const rangedWeapon = data.armaDisparoAtiva && typeof data.armaDisparoAtiva === 'object' ? data.armaDisparoAtiva : null;
            const ammoCurrent = rangedWeapon ? Math.max(0, safeNumber(rangedWeapon.atual)) : 0;
            const ammoCapacity = rangedWeapon ? Math.max(0, safeNumber(rangedWeapon.capacidade)) : 0;
            const previous = previousVitals.get(code);
            const playerColor = normalizePlayerColor(data.corOverlay || data.fullData?.info?.char_cor_overlay);
            const statusData = data.status && typeof data.status === 'object'
                ? data.status
                : (data.fullData?.charStatus && typeof data.fullData.charStatus === 'object' ? data.fullData.charStatus : {});
            const unconscious = isActiveFlag(statusData.inconsciente);
            const dying = isActiveFlag(statusData.morrendo);
            const combatActive = isActiveFlag(data.modoCombate);

            article.setAttribute('aria-label', name);
            article.style.setProperty('--player-color', playerColor);
            article.classList.toggle('unconscious', unconscious);
            article.classList.toggle('dying', dying);
            renderPlayerName(article.querySelector('.name'), name);
            article.querySelector('.life-value').textContent = `${lifeCurrent}/${lifeMaximum}`;
            article.querySelector('.sanity-value').textContent = `${sanityCurrent}/${sanityMaximum}`;
            flashCombatNumber(article, '.combat-number.life', previous && previous.life !== lifeCurrent);
            flashCombatNumber(article, '.combat-number.sanity', previous && previous.sanity !== sanityCurrent);
            const ammoLine = article.querySelector('.combat-number.ammo');
            ammoLine.hidden = !rangedWeapon;
            ammoLine.classList.toggle('empty', Boolean(rangedWeapon) && ammoCurrent <= 0);
            const lowAmmoLimit = ammoCapacity > 0 ? Math.max(1, Math.ceil(ammoCapacity * 0.25)) : 2;
            ammoLine.classList.toggle('low', Boolean(rangedWeapon) && ammoCurrent > 0 && ammoCurrent <= lowAmmoLimit);
            if (rangedWeapon) {
                const ammoType = String(rangedWeapon.municao || 'Munição');
                const ammoIconData = getAmmoIcon(ammoType);
                const ammoIcon = article.querySelector('.ammo-icon');
                article.querySelector('.ammo-value').textContent = `${ammoCurrent}`;
                ammoIcon.hidden = !ammoIconData;
                article.querySelector('.ammo-text-prefix').hidden = Boolean(ammoIconData);
                if (ammoIconData) {
                    if (ammoIcon.src !== ammoIconData.src) ammoIcon.src = ammoIconData.src;
                    ammoIcon.alt = ammoIconData.alt;
                } else {
                    ammoIcon.removeAttribute('src');
                    ammoIcon.alt = '';
                }
                ammoLine.title = `${String(rangedWeapon.nome || 'Arma de disparo')} — ${ammoType}: ${ammoCurrent} de ${ammoCapacity}`;
                flashCombatNumber(article, '.combat-number.ammo', previous && previous.ammo !== ammoCurrent);
            }

            if (previous) {
                if (lifeCurrent < previous.life) restartTimedEffect(article, 'damage-hit', 720);
                if (sanityCurrent < previous.sanity) restartTimedEffect(article, 'sanity-hit', 980);
                if (!previous.combat && combatActive) restartTimedEffect(article, 'combat-entering', 940);
            }
            const portrait = article.querySelector('.portrait');
            const portraitImages = [...portrait.querySelectorAll('.portrait-image')];
            const fallback = article.querySelector('.portrait-fallback');
            const photo = String(data.foto || '');

            if (photo && portrait.dataset.currentSource === photo) {
                if (portrait.dataset.loadingSource && portrait.dataset.loadingSource !== photo) {
                    delete portrait.dataset.loadingSource;
                }
            } else if (photo && portrait.dataset.loadingSource !== photo) {
                portrait.dataset.loadingSource = photo;
                const preload = new Image();
                preload.onload = () => {
                    if (portrait.dataset.loadingSource !== photo) return;
                    const currentImage = portrait.querySelector('.portrait-image.active');
                    const nextImage = portraitImages.find(item => item !== currentImage) || portraitImages[0];

                    nextImage.classList.remove('active');
                    nextImage.src = photo;
                    nextImage.hidden = false;
                    void nextImage.offsetWidth;

                    fallback.style.display = 'none';
                    nextImage.classList.add('active');
                    if (currentImage && currentImage !== nextImage) currentImage.classList.remove('active');

                    portrait.dataset.currentSource = photo;
                    delete portrait.dataset.loadingSource;

                    if (portrait._imageCleanupTimer) clearTimeout(portrait._imageCleanupTimer);
                    portrait._imageCleanupTimer = setTimeout(() => {
                        portraitImages.forEach(item => {
                            if (item.classList.contains('active')) return;
                            item.hidden = true;
                            item.removeAttribute('src');
                        });
                    }, 700);
                };
                preload.onerror = () => {
                    if (portrait.dataset.loadingSource !== photo) return;
                    delete portrait.dataset.loadingSource;
                    if (!portrait.dataset.currentSource) {
                        fallback.style.display = 'grid';
                    }
                };
                preload.src = photo;
            } else if (!photo) {
                delete portrait.dataset.loadingSource;
                delete portrait.dataset.currentSource;
                if (portrait._imageCleanupTimer) clearTimeout(portrait._imageCleanupTimer);
                portraitImages.forEach(item => {
                    item.classList.remove('active');
                    item.hidden = true;
                    item.removeAttribute('src');
                });
                fallback.style.display = 'grid';
            }

            previousVitals.set(code, { life: lifeCurrent, sanity: sanityCurrent, ammo: rangedWeapon ? ammoCurrent : null, combat: combatActive, unconscious });
            sortWidgets();
            updateTurnHighlight();
            hideConnectionMessage();
        }

        function sortWidgets() {
            const positions = new Map(stablePlayerOrder.map((code, index) => [code, index]));
            const sortedWidgets = [...grid.children]
                .sort((first, second) => {
                    const firstPosition = positions.get(first.dataset.code) ?? Number.MAX_SAFE_INTEGER;
                    const secondPosition = positions.get(second.dataset.code) ?? Number.MAX_SAFE_INTEGER;
                    return firstPosition - secondPosition;
                });

            sortedWidgets.forEach((widget, index) => {
                const currentWidget = grid.children[index];
                if (currentWidget !== widget) grid.insertBefore(widget, currentWidget || null);
            });
        }

        function removePlayer(codeValue) {
            const code = String(codeValue || '').trim().toUpperCase();
            players.delete(code);
            previousVitals.delete(code);
            const article = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
            if (article) {
                article.classList.add('leaving');
                setTimeout(() => article.remove(), 210);
            }
            if (!players.size) setConnectionMessage('Aguardando jogadores conectados...');
        }

        function keepDisconnectedPlayer(codeValue) {
            const code = String(codeValue || '').trim().toUpperCase();
            const data = players.get(code);
            if (!data) return;
            players.set(code, { ...data, online: false });
        }

        function hidePlayerUntilReconnect(codeValue) {
            const code = String(codeValue || '').trim().toUpperCase();
            if (!code) return;
            manuallyHiddenPlayers.add(code);
            saveHiddenPlayers();
            previousVitals.delete(code);
            const article = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
            if (article) {
                article.classList.add('leaving');
                setTimeout(() => article.remove(), 210);
            }
        }

        function releasePlayerAfterReconnect(data) {
            if (normalizeTableCode(data && data.mesa) !== tableCode) return;
            const code = playerCode(data);
            if (!code || !manuallyHiddenPlayers.delete(code)) return;
            saveHiddenPlayers();
        }

        function activePlayerCode() {
            if (!initiativeState || !initiativeState.started || !initiativeState.activeId) return '';
            const activeId = String(initiativeState.activeId);
            if (activeId.startsWith('player_')) return activeId.slice(7).toUpperCase();
            const entry = Array.isArray(initiativeState.entries)
                ? initiativeState.entries.find(item => String(item.id) === activeId)
                : null;
            return String(entry && entry.code || '').toUpperCase();
        }

        function updateTurnHighlight() {
            const activeCode = activePlayerCode();
            grid.querySelectorAll('.player-widget').forEach(widget => {
                const player = players.get(widget.dataset.code);
                const combatActive = Boolean(player && isActiveFlag(player.modoCombate));
                widget.classList.toggle('active-turn', combatActive && Boolean(activeCode) && widget.dataset.code === activeCode);
                widget.classList.toggle('combat-mode', combatActive);
                widget.querySelector('.identity').classList.toggle('hidden', combatActive);
                widget.querySelector('.combat-stats').classList.toggle('active', combatActive);
            });
        }

        socket.on('connect', () => {
            setConnectionMessage(`Conectado. Buscando jogadores da mesa ${tableCode}...`);
            socket.emit('overlay_ready', { mesa: tableCode });
        });

        socket.on('disconnect', () => setConnectionMessage('Servidor desconectado — tentando reconectar...', 'error'));

        socket.on('players_snapshot', snapshot => {
            const receivedCodes = new Set();
            (Array.isArray(snapshot) ? snapshot : []).filter(data => normalizeTableCode(data && data.mesa) === tableCode).forEach(data => {
                const code = playerCode(data);
                if (!code) return;
                receivedCodes.add(code);
                updatePlayerWidget(data);
            });
            if (!receivedCodes.size && !players.size) setConnectionMessage(`Aguardando jogadores da mesa ${tableCode}...`);
            else hideConnectionMessage();
        });

        socket.on('update_mestre', data => {
            if (normalizeTableCode(data && data.mesa) === tableCode) updatePlayerWidget(data);
        });
        socket.on('player_connected', releasePlayerAfterReconnect);
        socket.on('player_disconnected', data => {
            if (normalizeTableCode(data && data.mesa) === tableCode) keepDisconnectedPlayer(data && data.codigo);
        });
        socket.on('initiative_state_updated', state => {
            initiativeState = state && typeof state === 'object'
                ? state
                : { entries: [], activeId: null, round: 0, started: false };
            updateTurnHighlight();
        });
        if (!overlayTableFromUrl) {
            window.addEventListener('storage', event => {
                if (!overlayTablePinned && event.key === 'master_table_code' && event.newValue) switchOverlayTable(event.newValue);
            });
        }
    </script>
</body>
</html>
