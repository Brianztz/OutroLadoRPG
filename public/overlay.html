<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay da Mesa</title>
    <style>
        @font-face {
            font-family: "ITC Krist";
            src: url("./ITCKRIST.TTF") format("truetype");
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --cyan: #00b8f5;
            --cyan-soft: rgba(0, 184, 245, 0.28);
            --red: #ec334d;
            --red-dark: #8b1028;
            --sanity: #7187ff;
            --sanity-dark: #303a9e;
            --gold: #ffc83d;
            --panel: rgba(10, 13, 18, 0.94);
            --line: rgba(197, 218, 231, 0.18);
            --muted: #91a0ab;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
            background: transparent;
        }

        body {
            padding: 0;
            overflow: hidden;
            color: #fff;
            font-family: "ITC Krist", sans-serif;
        }

        .overlay-grid {
            position: fixed;
            z-index: 5;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .stream-frame {
            position: fixed;
            z-index: 20;
            inset: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 3px rgba(145, 0, 0, 0.72));
        }

        .stream-frame::before {
            content: "";
            position: absolute;
            inset: 0.45%;
            border: clamp(3px, 0.34vw, 6px) solid #760707;
            box-shadow: inset 0 0 8px rgba(255, 20, 20, 0.28), 0 0 5px rgba(34, 0, 0, 0.9);
        }

        .frame-line {
            position: absolute;
            display: block;
            background: linear-gradient(90deg, #3d0204 0%, #940909 22%, #530305 52%, #a30b0b 78%, #420204 100%);
            box-shadow: 0 0 4px rgba(255, 18, 18, 0.28), 0 1px 0 rgba(20, 0, 0, 0.9);
        }

        .frame-line.vertical {
            width: clamp(3px, 0.34vw, 6px);
            background: linear-gradient(180deg, #3d0204 0%, #940909 22%, #530305 52%, #a30b0b 78%, #420204 100%);
        }

        .frame-main-vertical { left: 66.55%; top: 0; height: 100%; }
        .frame-top-vertical { left: 33.85%; top: 0; height: 34.1%; }
        .frame-short-vertical { left: 19.35%; top: 19.4%; height: 14.7%; }
        .frame-main-horizontal { left: 0; top: 34.1%; width: 100%; height: clamp(3px, 0.34vw, 6px); }
        .frame-right-horizontal { left: 66.55%; top: 66.3%; width: 33.45%; height: clamp(3px, 0.34vw, 6px); }

        .overlay-table-button {
            position: fixed;
            z-index: 100;
            top: 16px;
            right: 16px;
            padding: 8px 13px;
            border: 1px solid rgba(0, 184, 245, 0.55);
            border-radius: 999px;
            background: rgba(7, 10, 14, 0.78);
            box-shadow: 0 0 14px rgba(0, 184, 245, 0.14), 0 6px 18px rgba(0, 0, 0, 0.38);
            color: #a9bac4;
            font: 800 0.72rem/1 "ITC Krist", sans-serif;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.72;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .overlay-table-button:hover,
        .overlay-table-button:focus-visible {
            opacity: 1;
            border-color: var(--cyan);
            box-shadow: 0 0 18px rgba(0, 184, 245, 0.28), 0 6px 18px rgba(0, 0, 0, 0.42);
            transform: translateY(-1px);
            outline: none;
        }

        .overlay-table-button span { color: #fff; }

        .player-widget {
            --player-color: #00b8f5;
            position: absolute;
            z-index: 6;
            display: flex;
            align-items: flex-end;
            min-width: 0;
            min-height: 0;
            padding: 0 0 clamp(6px, 1.1vh, 13px) clamp(7px, 0.8vw, 16px);
            overflow: hidden;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.52));
            animation: widget-in 0.36s ease both;
        }

        .player-widget[data-slot="1"] { left: 66.55%; top: 34.1%; width: 33.45%; height: 32.2%; }
        .player-widget[data-slot="2"] { left: 66.55%; top: 66.3%; width: 33.45%; height: 33.7%; }
        .player-widget[data-slot="3"] { left: 66.55%; top: 0; width: 33.45%; height: 34.1%; }
        .player-widget[data-slot="4"] { left: 33.85%; top: 0; width: 32.7%; height: 34.1%; }
        .player-widget[data-slot="5"] { left: 0; top: 0; width: 33.85%; height: 34.1%; }
        .player-widget[data-slot="6"] { left: 0; top: 34.1%; width: 22.18%; height: 65.9%; }
        .player-widget[data-slot="7"] { left: 22.18%; top: 34.1%; width: 22.18%; height: 65.9%; }
        .player-widget[data-slot="8"] { left: 44.36%; top: 34.1%; width: 22.19%; height: 65.9%; }

        .player-widget.leaving {
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .portrait {
            position: relative;
            z-index: 3;
            flex: 0 0 clamp(58px, 7vw, 142px);
            width: clamp(58px, 7vw, 142px);
            height: clamp(58px, 7vw, 142px);
            overflow: hidden;
            border: 0;
            border-radius: 50%;
            background: transparent;
            box-shadow: none;
            filter: drop-shadow(0 0 3px var(--player-color)) drop-shadow(0 0 8px var(--player-color));
            transform-origin: 50% 76%;
            will-change: transform;
            animation: portrait-breathe 4.2s ease-in-out infinite;
        }

        .portrait::after {
            content: none;
        }

        .portrait img {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            backface-visibility: hidden;
            transform: translateZ(0);
            transition: opacity 0.65s ease;
        }

        .portrait img.active {
            opacity: 1;
        }

        .portrait-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2.6rem;
            font-weight: 900;
        }

        .display-stack {
            position: relative;
            z-index: 2;
            display: grid;
            flex: 1 1 auto;
            min-width: 0;
            min-height: clamp(50px, 5.5vw, 106px);
            margin-left: clamp(7px, 0.85vw, 17px);
            align-items: center;
        }

        .identity {
            grid-area: 1 / 1;
            min-width: 0;
            opacity: 1;
            visibility: visible;
            filter: blur(0);
            transition: opacity 0.7s ease, filter 0.7s ease, visibility 0s;
        }

        .identity.hidden {
            opacity: 0;
            visibility: hidden;
            filter: blur(4px);
            transition: opacity 0.7s ease, filter 0.7s ease, visibility 0s linear 0.7s;
        }

        .name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            overflow: hidden;
            color: #f6fbff;
            font-family: "ITC Krist", sans-serif;
            max-width: 18vw;
            font-size: clamp(0.82rem, 1.35vw, 1.7rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 1.1px;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: normal;
            overflow-wrap: anywhere;
            text-shadow: 0 2px 3px #000, 0 0 8px rgba(0, 184, 245, 0.18);
            transform: translateX(clamp(-26px, -1.35vw, -12px)) rotate(-2deg);
        }

        .name-line { display: block; }

        .combat-stats {
            grid-area: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-left: 0;
            opacity: 0;
            visibility: hidden;
            filter: blur(4px);
            transition: opacity 0.7s ease, filter 0.7s ease, visibility 0s linear 0.7s;
            pointer-events: none;
        }

        .combat-stats.active {
            opacity: 1;
            visibility: visible;
            filter: blur(0);
            transition: opacity 0.7s ease, filter 0.7s ease, visibility 0s;
        }

        .combat-number {
            display: flex;
            align-items: baseline;
            gap: clamp(4px, 0.48vw, 10px);
            color: #fff;
            font-family: "ITC Krist", sans-serif;
            font-size: clamp(1rem, 1.75vw, 2.25rem);
            font-weight: 700;
            line-height: 0.96;
            letter-spacing: -1px;
            white-space: nowrap;
            text-shadow: 0 2px 3px #000;
        }

        .combat-prefix {
            width: 27px;
            font-family: "ITC Krist", sans-serif;
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-align: right;
        }

        .combat-number.life {
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(255,45,55,0.9), 0 0 10px rgba(255,45,55,0.45);
        }

        .combat-number.sanity {
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(92,117,255,0.9), 0 0 10px rgba(92,117,255,0.48);
        }

        .combat-number.ammo {
            align-items: center;
            margin-bottom: clamp(1px, 0.35vh, 4px);
            color: #ffe47c;
            font-family: "ITC Krist", sans-serif;
            font-size: clamp(0.9rem, 1.45vw, 1.85rem);
            letter-spacing: 0;
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(255,200,61,0.88), 0 0 10px rgba(255,200,61,0.4);
        }

        .combat-number.ammo[hidden] { display: none; }

        .ammo-icon {
            width: clamp(24px, 3vw, 50px);
            height: clamp(24px, 3vw, 50px);
            margin: clamp(-8px, -0.4vw, -3px) clamp(-6px, -0.3vw, -2px);
            object-fit: contain;
            filter: drop-shadow(0 2px 2px #000) drop-shadow(0 0 5px rgba(255,200,61,0.6));
        }

        .ammo-icon[hidden], .ammo-text-prefix[hidden] { display: none; }

        .ammo-value { display: inline-flex; align-items: center; line-height: 1; }

        .combat-number.ammo.empty {
            color: #ff8d99;
            text-shadow: 0 2px 3px #000, 0 0 5px rgba(236,51,77,0.9), 0 0 10px rgba(236,51,77,0.45);
        }

        .turn-badge {
            position: absolute;
            z-index: 5;
            top: clamp(4px, 1vh, 12px);
            left: clamp(65px, 7.8vw, 158px);
            padding: 4px 11px;
            border: 1px solid #fff0aa;
            border-radius: 999px;
            background: linear-gradient(135deg, #745000, #e0a413);
            box-shadow: 0 2px 8px #000, 0 0 13px rgba(255, 200, 61, 0.48);
            color: #fff8d5;
            font-size: 0.64rem;
            font-weight: 900;
            letter-spacing: 1px;
            opacity: 0;
            text-transform: uppercase;
            transform: translateY(5px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .player-widget.active-turn .turn-badge {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: badge-pulse 1.8s ease-in-out infinite;
        }

        .player-widget.active-turn .portrait {
            box-shadow: none;
        }

        .connection-state {
            display: none;
            width: max-content;
            max-width: calc(100vw - 48px);
            padding: 10px 14px;
            border: 1px solid rgba(0,184,245,0.35);
            border-radius: 8px;
            background: rgba(7,10,14,0.88);
            box-shadow: 0 8px 22px rgba(0,0,0,0.45);
            color: #a9bac4;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .connection-state.visible { display: block; }
        .connection-state.error { border-color: rgba(236,51,77,0.6); color: #ff9aaa; }

        .combat-number.changed { animation: number-flash 0.65s ease; }

        @keyframes widget-in {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes number-flash {
            0%, 100% { filter: brightness(1); }
            45% { filter: brightness(1.8); }
        }

        @keyframes badge-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
        }

        @keyframes portrait-breathe {
            0%, 100% {
                transform: translate3d(0, 1px, 0) rotate(-0.35deg) scale(0.992);
            }
            25% {
                transform: translate3d(1px, -2px, 0) rotate(0.15deg) scale(1.006);
            }
            50% {
                transform: translate3d(0, -5px, 0) rotate(0.45deg) scale(1.022);
            }
            75% {
                transform: translate3d(-1px, -2px, 0) rotate(0deg) scale(1.006);
            }
        }

        @media (max-width: 560px) {
            .overlay-table-button { top: 8px; right: 8px; padding: 6px 9px; font-size: 0.58rem; }
        }
    </style>
</head>
<body>
    <button id="overlay-table-button" class="overlay-table-button" type="button" onclick="chooseOverlayTable()" title="Escolher a mesa exibida no overlay">MESA: <span id="overlay-table-code">PADRAO</span></button>
    <main id="overlay-grid" class="overlay-grid" aria-live="polite"></main>
    <div class="stream-frame" aria-hidden="true">
        <span class="frame-line vertical frame-main-vertical"></span>
        <span class="frame-line vertical frame-top-vertical"></span>
        <span class="frame-line vertical frame-short-vertical"></span>
        <span class="frame-line frame-main-horizontal"></span>
        <span class="frame-line frame-right-horizontal"></span>
    </div>
    <div id="connection-state" class="connection-state visible" role="status">Conectando ao servidor...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const grid = document.getElementById('overlay-grid');
        const connectionState = document.getElementById('connection-state');
        const overlayTableCode = document.getElementById('overlay-table-code');
        const players = new Map();
        const previousVitals = new Map();
        const playerSlots = new Map();
        const playerSlotCount = 8;
        let initiativeState = { entries: [], activeId: null, round: 0, started: false };
        const overlayUrlParams = new URLSearchParams(window.location.search);
        const overlayTableFromUrl = overlayUrlParams.get('mesa');
        let overlayTablePinned = Boolean(overlayTableFromUrl);
        let tableCode = normalizeTableCode(overlayTableFromUrl || localStorage.getItem('overlay_table_code') || localStorage.getItem('master_table_code') || 'PADRAO');
        localStorage.setItem('overlay_table_code', tableCode);
        const ammoIcons = {
            light: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjZ4l-yL1koYZgphvunMSkAIAG1b5Y-kRGD1FDCa4NYXgUmnK5zd0lQ4L2rXGGR7fVcqMzyi7zeGl4uALRwnSciJTRO_RoeGpnM0MvHcQg6B8VAP9FYJXM7loiWxw5M4P1ppT3Y7fI988i66gvHyKmLwO1FXdqgIisZUkrT5t3jT4swFn2mtBU0YN_HDIlj/s320/Muni%C3%A7%C3%A3o%20de%20Pistola.png',
            long: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh4Gbg5h1YE1QbOrGtbUDGne4ND4r-bblO6TSVF97zK69AzvJHlwTtM3ywhUCKpYJn8rlpjcskhnD92w9nRcNTAI7QO-1Ah_VkvT0LCr5GK-_BonkUnfQrZM9bY9rHaKWn5Pc0QiCBt5ISLZg4GiwYGd8jXoMjrkoMHCP4jzBDc_l7t9Fh3jfkj_SG8m1_E/s320/Muni%C3%A7%C3%A3o%20Longa.png',
            heavy: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCTDQJKWwpqDv-PTxw8q_bvKKvtnNAw6j3J2qte7CTtVDFLeFe_gtQK-xNbDUGYzyeGAAXNa-Wvnk4Z0wr5jmKOEjFya0fuzhF9ROQIaojydXG6gQIKfbYnlrMY2SpskCuXuQtzL7sZjn8kO0AyreCDk-U-OiOEaFcurIUBgRI2UNvUWxqdTorb9YkY-Qi/s320/Muni%C3%A7%C3%A3o%20Pesada.png'
        };

        function normalizeTableCode(value) {
            const normalized = String(value || 'PADRAO').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase().replace(/[^A-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
            return normalized || 'PADRAO';
        }

        function safeNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function getAmmoIcon(ammoType) {
            const type = String(ammoType || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            if (/pesad/.test(type)) return { src: ammoIcons.heavy, alt: 'Munição pesada' };
            if (/long/.test(type)) return { src: ammoIcons.long, alt: 'Munição longa' };
            if (/curt|leve/.test(type)) return { src: ammoIcons.light, alt: 'Munição leve' };
            return null;
        }

        function normalizePlayerColor(value) {
            const color = String(value || '').trim();
            if (/^#[0-9a-f]{6}$/i.test(color)) return color;
            if (/^#[0-9a-f]{3}$/i.test(color)) {
                return `#${color.slice(1).split('').map(char => char + char).join('')}`;
            }
            return '#00b8f5';
        }

        function playerCode(data) {
            return String(data && (data.codigo || data.id) || '').trim().toUpperCase();
        }

        function assignPlayerSlot(code) {
            if (playerSlots.has(code)) return playerSlots.get(code);
            const occupiedSlots = new Set(playerSlots.values());
            let slot = 1;
            while (slot <= playerSlotCount && occupiedSlots.has(slot)) slot += 1;
            if (slot > playerSlotCount) slot = playerSlotCount;
            playerSlots.set(code, slot);
            return slot;
        }

        function setConnectionMessage(message, type = '') {
            connectionState.textContent = message;
            connectionState.className = `connection-state visible${type ? ` ${type}` : ''}`;
        }

        function hideConnectionMessage() {
            connectionState.className = 'connection-state';
        }

        function chooseOverlayTable() {
            const value = window.prompt('Digite o nome ou código da mesa que o overlay deve mostrar:', tableCode);
            if (value === null) return;
            const nextTable = normalizeTableCode(value);
            overlayTablePinned = true;
            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('mesa', nextTable);
            window.history.replaceState(null, '', nextUrl);
            switchOverlayTable(nextTable);
        }

        function switchOverlayTable(value) {
            const nextTable = normalizeTableCode(value);
            overlayTableCode.textContent = nextTable;
            if (nextTable === tableCode) {
                localStorage.setItem('overlay_table_code', nextTable);
                return;
            }
            tableCode = nextTable;
            localStorage.setItem('overlay_table_code', tableCode);
            players.clear();
            previousVitals.clear();
            playerSlots.clear();
            grid.replaceChildren();
            initiativeState = { entries: [], activeId: null, round: 0, started: false };
            setConnectionMessage(`Buscando jogadores da mesa ${tableCode}...`);
            if (socket.connected) socket.emit('overlay_ready', { mesa: tableCode });
        }

        overlayTableCode.textContent = tableCode;

        function renderPlayerName(element, name) {
            const parts = String(name || 'Personagem').trim().split(/\s+/).filter(Boolean);
            element.replaceChildren(...parts.map(part => {
                const line = document.createElement('span');
                line.className = 'name-line';
                line.textContent = part;
                return line;
            }));
        }

        function createPlayerWidget(code) {
            const article = document.createElement('article');
            article.className = 'player-widget';
            article.dataset.code = code;
            article.dataset.slot = String(assignPlayerSlot(code));
            article.innerHTML = `
                <div class="turn-badge">⚔ Turno atual</div>
                <div class="portrait">
                    <div class="portrait-fallback">?</div>
                    <img class="portrait-image" data-layer="a" alt="" hidden>
                    <img class="portrait-image" data-layer="b" alt="" hidden>
                </div>
                <div class="display-stack">
                    <div class="identity">
                        <div class="name">Personagem</div>
                    </div>
                    <div class="combat-stats" aria-label="Vida e sanidade">
                        <span class="combat-number ammo" hidden><span class="combat-prefix ammo-text-prefix">MUN</span><img class="ammo-icon" alt="" hidden><span class="ammo-value">0</span></span>
                        <span class="combat-number life" title="Vida"><span class="life-value">0/0</span></span>
                        <span class="combat-number sanity" title="Sanidade"><span class="sanity-value">0/0</span></span>
                    </div>
                </div>`;

            return article;
        }

        function flashCombatNumber(article, selector, changed) {
            const number = article.querySelector(selector);
            if (changed) {
                number.classList.remove('changed');
                void number.offsetWidth;
                number.classList.add('changed');
            }
        }

        function updatePlayerWidget(data) {
            const code = playerCode(data);
            if (!code) return;
            players.set(code, data);

            let article = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
            if (!article) {
                article = createPlayerWidget(code);
                grid.appendChild(article);
            }

            const name = String(data.nome || 'Personagem sem nome');
            const lifeCurrent = safeNumber(data.vida_atual);
            const lifeMaximum = Math.max(0, safeNumber(data.vida_max));
            const sanityCurrent = safeNumber(data.sani_atual);
            const sanityMaximum = Math.max(0, safeNumber(data.sani_max));
            const rangedWeapon = data.armaDisparoAtiva && typeof data.armaDisparoAtiva === 'object' ? data.armaDisparoAtiva : null;
            const ammoCurrent = rangedWeapon ? Math.max(0, safeNumber(rangedWeapon.atual)) : 0;
            const ammoCapacity = rangedWeapon ? Math.max(0, safeNumber(rangedWeapon.capacidade)) : 0;
            const previous = previousVitals.get(code);
            const playerColor = normalizePlayerColor(data.corOverlay || data.fullData?.info?.char_cor_overlay);

            article.setAttribute('aria-label', name);
            article.style.setProperty('--player-color', playerColor);
            renderPlayerName(article.querySelector('.name'), name);
            article.querySelector('.life-value').textContent = `${lifeCurrent}/${lifeMaximum}`;
            article.querySelector('.sanity-value').textContent = `${sanityCurrent}/${sanityMaximum}`;
            flashCombatNumber(article, '.combat-number.life', previous && previous.life !== lifeCurrent);
            flashCombatNumber(article, '.combat-number.sanity', previous && previous.sanity !== sanityCurrent);
            const ammoLine = article.querySelector('.combat-number.ammo');
            ammoLine.hidden = !rangedWeapon;
            ammoLine.classList.toggle('empty', Boolean(rangedWeapon) && ammoCurrent <= 0);
            if (rangedWeapon) {
                const ammoType = String(rangedWeapon.municao || 'Munição');
                const ammoIconData = getAmmoIcon(ammoType);
                const ammoIcon = article.querySelector('.ammo-icon');
                article.querySelector('.ammo-value').textContent = `${ammoCurrent}`;
                ammoIcon.hidden = !ammoIconData;
                article.querySelector('.ammo-text-prefix').hidden = Boolean(ammoIconData);
                if (ammoIconData) {
                    if (ammoIcon.src !== ammoIconData.src) ammoIcon.src = ammoIconData.src;
                    ammoIcon.alt = ammoIconData.alt;
                } else {
                    ammoIcon.removeAttribute('src');
                    ammoIcon.alt = '';
                }
                ammoLine.title = `${String(rangedWeapon.nome || 'Arma de disparo')} — ${ammoType}: ${ammoCurrent} de ${ammoCapacity}`;
                flashCombatNumber(article, '.combat-number.ammo', previous && previous.ammo !== ammoCurrent);
            }
            const portrait = article.querySelector('.portrait');
            const portraitImages = [...portrait.querySelectorAll('.portrait-image')];
            const fallback = article.querySelector('.portrait-fallback');
            const photo = String(data.foto || '');

            if (photo && portrait.dataset.currentSource === photo) {
                if (portrait.dataset.loadingSource && portrait.dataset.loadingSource !== photo) {
                    delete portrait.dataset.loadingSource;
                }
            } else if (photo && portrait.dataset.loadingSource !== photo) {
                portrait.dataset.loadingSource = photo;
                const preload = new Image();
                preload.onload = () => {
                    if (portrait.dataset.loadingSource !== photo) return;
                    const currentImage = portrait.querySelector('.portrait-image.active');
                    const nextImage = portraitImages.find(item => item !== currentImage) || portraitImages[0];

                    nextImage.classList.remove('active');
                    nextImage.src = photo;
                    nextImage.hidden = false;
                    void nextImage.offsetWidth;

                    fallback.style.display = 'none';
                    nextImage.classList.add('active');
                    if (currentImage && currentImage !== nextImage) currentImage.classList.remove('active');

                    portrait.dataset.currentSource = photo;
                    delete portrait.dataset.loadingSource;

                    if (portrait._imageCleanupTimer) clearTimeout(portrait._imageCleanupTimer);
                    portrait._imageCleanupTimer = setTimeout(() => {
                        portraitImages.forEach(item => {
                            if (item.classList.contains('active')) return;
                            item.hidden = true;
                            item.removeAttribute('src');
                        });
                    }, 700);
                };
                preload.onerror = () => {
                    if (portrait.dataset.loadingSource !== photo) return;
                    delete portrait.dataset.loadingSource;
                    if (!portrait.dataset.currentSource) {
                        fallback.style.display = 'grid';
                    }
                };
                preload.src = photo;
            } else if (!photo) {
                delete portrait.dataset.loadingSource;
                delete portrait.dataset.currentSource;
                if (portrait._imageCleanupTimer) clearTimeout(portrait._imageCleanupTimer);
                portraitImages.forEach(item => {
                    item.classList.remove('active');
                    item.hidden = true;
                    item.removeAttribute('src');
                });
                fallback.style.display = 'grid';
            }

            previousVitals.set(code, { life: lifeCurrent, sanity: sanityCurrent, ammo: rangedWeapon ? ammoCurrent : null });
            sortWidgets();
            updateTurnHighlight();
            hideConnectionMessage();
        }

        function sortWidgets() {
            const sortedWidgets = [...grid.children]
                .sort((first, second) => {
                    const firstName = players.get(first.dataset.code)?.nome || '';
                    const secondName = players.get(second.dataset.code)?.nome || '';
                    return String(firstName).localeCompare(String(secondName), 'pt-BR');
                });

            sortedWidgets.forEach((widget, index) => {
                const currentWidget = grid.children[index];
                if (currentWidget !== widget) grid.insertBefore(widget, currentWidget || null);
            });
        }

        function removePlayer(codeValue) {
            const code = String(codeValue || '').trim().toUpperCase();
            players.delete(code);
            previousVitals.delete(code);
            playerSlots.delete(code);
            const article = grid.querySelector(`[data-code="${CSS.escape(code)}"]`);
            if (article) {
                article.classList.add('leaving');
                setTimeout(() => article.remove(), 210);
            }
            if (!players.size) setConnectionMessage('Aguardando jogadores conectados...');
        }

        function activePlayerCode() {
            if (!initiativeState || !initiativeState.started || !initiativeState.activeId) return '';
            const activeId = String(initiativeState.activeId);
            if (activeId.startsWith('player_')) return activeId.slice(7).toUpperCase();
            const entry = Array.isArray(initiativeState.entries)
                ? initiativeState.entries.find(item => String(item.id) === activeId)
                : null;
            return String(entry && entry.code || '').toUpperCase();
        }

        function updateTurnHighlight() {
            const activeCode = activePlayerCode();
            grid.querySelectorAll('.player-widget').forEach(widget => {
                const player = players.get(widget.dataset.code);
                const combatActive = Boolean(player && (player.modoCombate === true || player.modoCombate === 'true'));
                widget.classList.toggle('active-turn', Boolean(activeCode) && widget.dataset.code === activeCode);
                widget.querySelector('.identity').classList.toggle('hidden', combatActive);
                widget.querySelector('.combat-stats').classList.toggle('active', combatActive);
            });
        }

        socket.on('connect', () => {
            setConnectionMessage(`Conectado. Buscando jogadores da mesa ${tableCode}...`);
            socket.emit('overlay_ready', { mesa: tableCode });
        });

        socket.on('disconnect', () => setConnectionMessage('Servidor desconectado — tentando reconectar...', 'error'));

        socket.on('players_snapshot', snapshot => {
            const receivedCodes = new Set();
            (Array.isArray(snapshot) ? snapshot : []).filter(data => normalizeTableCode(data && data.mesa) === tableCode).forEach(data => {
                const code = playerCode(data);
                if (!code) return;
                receivedCodes.add(code);
                updatePlayerWidget(data);
            });
            [...players.keys()].forEach(code => { if (!receivedCodes.has(code)) removePlayer(code); });
            if (!receivedCodes.size) setConnectionMessage(`Aguardando jogadores da mesa ${tableCode}...`);
        });

        socket.on('update_mestre', data => {
            if (normalizeTableCode(data && data.mesa) === tableCode) updatePlayerWidget(data);
        });
        socket.on('player_disconnected', data => {
            if (normalizeTableCode(data && data.mesa) === tableCode) removePlayer(data && data.codigo);
        });
        socket.on('initiative_state_updated', state => {
            initiativeState = state && typeof state === 'object'
                ? state
                : { entries: [], activeId: null, round: 0, started: false };
            updateTurnHighlight();
        });

        if (!overlayTableFromUrl) {
            window.addEventListener('storage', event => {
                if (!overlayTablePinned && event.key === 'master_table_code' && event.newValue) switchOverlayTable(event.newValue);
            });
        }
    </script>
</body>
</html>
